<meta charset="utf-8">
<!-- Time's Up Maison · v1.11 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Time's Up Maison</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-screen party game. Setup scrolls; the turn screen fills the viewport: giant timer, the card, a giant ✓ and a smaller ✗ under the thumb. Landscape puts timer+card left, buttons right. Single committed look: cobalt table, paper cards. */
:root{
  --bg:#1B2A8C;
  --bg-2:#24379E;
  --line:rgba(255,255,255,.16);
  --fg:#F3F5FF;
  --muted:#B3BCF2;
  --paper:#FFFBF0;
  --ink:#141A3A;
  --sun:#FFC93C;
  --mint:#3DDC97;
  --tomato:#FF5B47;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.6px);
  background-size:22px 22px;
  color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
#app{
  display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.ver{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:60;pointer-events:none;
  font:700 .72rem/1 var(--body);letter-spacing:.06em;color:var(--muted);opacity:.55;font-variant-numeric:tabular-nums}
.standalone #app{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.waiting-dot{width:72px;height:72px;margin:0 auto;border-radius:50%;border:8px solid rgba(255,255,255,.15);border-top-color:var(--sun);animation:spin 1s linear infinite}
#app.scroll{min-height:100%}
#app.fill{height:100%;min-height:520px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
svg{display:block}

/* Buttons */
.btn{
  font-family:var(--display);font-size:1.35rem;letter-spacing:.01em;
  border:0;border-radius:18px;min-height:62px;padding:0 24px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  box-shadow:0 5px 0 rgba(6,10,50,.4);
  transition:transform .06s ease,box-shadow .06s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;
  line-height:1.1;padding-block:10px;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(6,10,50,.4)}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn-ghost:active{box-shadow:inset 0 0 0 2px var(--line)}
.btn-tomato{background:var(--tomato);color:#fff}
.btn.small{min-height:46px;font-size:1.05rem;padding:0 18px;border-radius:14px}
.btn.wide{width:100%}
.btn-team{
  position:relative;overflow:hidden;
  background:var(--team);color:var(--ink);
  min-height:96px;width:100%;max-width:560px;border-radius:24px;padding:12px 28px;
  flex-direction:column;gap:2px;
  box-shadow:0 0 0 5px var(--paper),0 10px 0 5px rgba(6,10,50,.45);
}
.intro .btn-team{margin-bottom:clamp(28px,9vh,96px)}
.btn-team:active{box-shadow:0 0 0 5px var(--paper),0 4px 0 5px rgba(6,10,50,.45)}
.btn-team small{position:relative;font-family:var(--body);font-weight:800;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.btn-team strong{position:relative;font-weight:400;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05;overflow-wrap:anywhere}
.intro{justify-content:space-between}
.intro-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.go-pill{background:var(--ink);color:var(--paper);font-family:var(--display);font-size:1.4rem;padding:6px 22px;border-radius:999px;margin-top:6px;box-shadow:0 4px 0 rgba(6,10,50,.3)}
.seg button.hard[aria-pressed="true"]{background:var(--tomato);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Lobby (tablet) */
.lobby{flex:1;width:100%;max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;align-items:center;padding-block:16px}
.lobby-qr{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qr{width:min(78vw,340px,40vh);aspect-ratio:1;background:#fff;border-radius:24px;padding:14px;box-shadow:0 0 0 6px var(--paper),0 12px 0 6px rgba(6,10,50,.4);display:grid;place-items:center;color:var(--ink);font-weight:700}
.qr svg{width:100%;height:100%}
.qr.small{width:min(60vw,240px)}
.code{font-weight:700;color:var(--muted)}
.code b{font-family:var(--display);font-weight:400;font-size:2.2rem;letter-spacing:.12em;color:var(--paper);margin-left:6px}
.lobby-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.lobby-side h1{font-family:var(--display);font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;color:var(--paper)}
/* The player list scrolls inside its own box, so the start button above it never moves off screen */
.players{list-style:none;margin:0;padding:2px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;max-height:min(34vh,320px);overflow-y:auto;overscroll-behavior:contain}
.players li{display:flex;align-items:center;gap:8px;background:var(--bg-2);border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.players li.empty{grid-column:1/-1}
.players li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem}
.players li span.st{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.players li.ready span.st{color:var(--mint)}
.players li.empty{color:var(--muted);justify-content:center}
.pdot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
.pdot.on{background:var(--mint)}
.btn-team.as-label{cursor:default}
.btn-team.as-label:active{transform:none;box-shadow:0 0 0 5px var(--paper),0 10px 0 5px rgba(6,10,50,.45)}
.intro .btn-team.as-label{margin-bottom:8px}
.disc:not(button){cursor:default}
.who.warn{color:var(--sun)}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px;font-weight:600;font-size:.95rem}
.intro .link-btn{margin-bottom:clamp(16px,6vh,64px)}
.confirm-box{width:100%;max-width:480px;background:var(--bg-2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 2px var(--tomato);text-align:center}
.intro .confirm-box{margin-bottom:clamp(16px,6vh,64px)}
.confirm-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.crown-btn{flex:none;width:30px;height:30px;padding:3px;border:0;background:none;cursor:pointer;opacity:.28;filter:grayscale(1)}
.crown-btn.on{opacity:1;filter:none}
.crown-btn svg{width:100%;height:100%}
/* Admin remote (phone) */
.adm-fab{position:fixed;z-index:70;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:7px 12px 7px 9px;
  font-family:var(--display);font-size:1rem;box-shadow:0 4px 0 rgba(6,10,50,.4);cursor:pointer}
.adm-fab svg{width:22px;height:16px}
.adm-sec{display:flex;flex-direction:column;gap:10px}
.adm-sec h3{margin:6px 0 0}
.sheet .adm-players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.adm-players li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.adm-players li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-players .st{color:var(--muted);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.adm-players .ready .st{color:var(--mint)}
.adm-team{border:0;border-radius:999px;background:var(--team);color:var(--ink);font-family:var(--display);font-size:.85rem;padding:5px 10px;cursor:pointer;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-kick{border:0;background:none;color:var(--muted);font-weight:800;cursor:pointer;padding:4px 6px;white-space:nowrap}
.adm-kick.arm{color:var(--tomato)}
.adm-scores{display:flex;flex-wrap:wrap;gap:6px}
.adm-scores span{background:rgba(255,255,255,.08);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
.tdot{width:30px;height:30px;border-radius:50%;background:var(--team);border:3px solid var(--paper);padding:0;cursor:pointer;flex:none}
.legend-teams{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:4px}
.legend-teams span{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.legend-teams i{width:14px;height:14px;border-radius:50%;background:var(--team)}
.legend-teams .hint{flex-basis:100%;font-weight:400}
.lobby-side h1{font-size:clamp(1.8rem,3.8vw,2.6rem)!important}
.lobby-side .opt{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px}
.lobby-side .opt>span{min-width:150px;font-size:.95rem}
.lobby-side .seg button{min-height:42px;padding:0 15px}
.lobby-side .legend-teams{flex-basis:100%}
/* Landscape tablet: the lobby fills the screen and only the player list scrolls */
@media (orientation:landscape) and (min-width:720px){
  #app.lobbymode{height:100%;min-height:0}
  .lobbymode .lobby{min-height:0;align-items:stretch;padding-block:0}
  .lobbymode .lobby-qr{justify-content:center}
  .lobbymode .lobby-side{min-height:0;overflow:hidden;gap:12px}
  .lobbymode .players{flex:1 1 auto;min-height:96px;max-height:none}
}
.tchip{border:0;border-radius:999px;background:var(--team);color:var(--ink);font-family:var(--display);font-size:.9rem;padding:5px 10px;cursor:pointer;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis;flex:none}
.shared-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.shared-stage #t-num{font-size:clamp(7rem,min(34vw,32vh),20rem)}
.shared-stage .bar{height:18px;width:min(100%,820px)}
.giver-line{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.6rem);color:var(--paper)}
.giver-line b{font-weight:400;color:var(--team)}
.shared-meta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.shared-meta span{background:var(--bg-2);border-radius:999px;padding:8px 18px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--line);font-size:1.1rem}
.who{color:var(--muted);font-weight:700;font-size:1.1rem}
.who b{color:var(--paper)}
.kick{background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 6px}
.net{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--muted)}
.net i{width:10px;height:10px;border-radius:50%;background:var(--sun)}
.net.on i{background:var(--mint)}
.net.err{color:var(--tomato)}
.net.err i{background:var(--tomato)}

/* Phone */
.phone{flex:1;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:8px}
.phone-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.phone h1{font-family:var(--display);font-size:clamp(2.2rem,10vw,3rem);line-height:1.05;color:var(--paper)}
.phone .lead{color:var(--muted);font-size:1.05rem}
.pick-card{width:100%;min-height:120px;border:0;border-radius:22px;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.1;padding:22px;cursor:pointer;box-shadow:0 7px 0 rgba(6,10,50,.4);overflow-wrap:anywhere;transition:transform .06s}
.pick-card:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(6,10,50,.4)}
.pick-card small{display:block;font-family:var(--body);font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.45;margin-bottom:6px}
.or{font-family:var(--display);color:var(--sun);font-size:1.4rem}
.progress{height:10px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun);border-radius:999px}
.done-mark{width:110px;height:110px;margin:0 auto;border-radius:50%;background:var(--mint);color:#06281A;display:grid;place-items:center;box-shadow:0 0 0 7px var(--paper),0 10px 0 7px rgba(6,10,50,.35)}
.done-mark svg{width:58%;height:58%}
.mini-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mini-list span{background:var(--bg-2);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem;box-shadow:inset 0 0 0 1px var(--line)}
.chrono{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.chrono .pill{background:var(--team);color:var(--ink);font-family:var(--display);font-size:1.4rem;padding:6px 18px;border-radius:999px}
.chrono .rt{font-family:var(--display);font-size:1.6rem;color:var(--sun)}
#c-num{font-family:var(--display);font-size:clamp(7rem,48vw,16rem);line-height:.9;color:var(--paper);text-shadow:0 8px 0 rgba(6,10,50,.5);font-variant-numeric:tabular-nums}
#c-num small{font-size:.45em;vertical-align:.8em}
.chrono.danger #c-num{color:var(--tomato)}
.chrono .bar{width:100%;height:16px}
.chrono.danger .bar i{background:var(--tomato)}
.chrono .big-msg{font-family:var(--display);font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.05;color:var(--paper)}
.chrono .big-msg.bad{color:var(--tomato)}
/* Phone that holds the cards */
#app.fill.gmode{min-height:0}
.gturn{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;position:relative;
  display:grid;grid-template-rows:auto auto minmax(80px,1fr) auto;gap:clamp(18px,3vh,28px);align-items:center;justify-items:center}
.g-hud{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-team{background:var(--team);color:var(--ink);font-family:var(--display);font-size:.85rem;padding:3px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.g-round{font-family:var(--display);font-size:.95rem;color:var(--muted)}
.g-timer{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.gturn #c-num{font-family:var(--display);font-size:clamp(3rem,min(20vw,10vh),6rem);line-height:.9;color:var(--sun);text-shadow:0 5px 0 rgba(6,10,50,.5);font-variant-numeric:tabular-nums}
.gturn #c-num small{font-size:.5em;vertical-align:.7em}
.gturn .bar{width:100%;height:10px;margin:0}
.gturn.danger #c-num{color:var(--tomato)}
.gturn.danger .bar i{background:var(--tomato)}
.g-card{width:100%;height:100%;min-height:80px;max-height:300px;padding:20px}
.g-card .word{font-size:clamp(1.8rem,min(9vw,6vh),3.4rem)}
.g-card .badge{min-width:42px;height:42px;font-size:1.2rem;right:-8px;bottom:-8px}
.g-btns{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,20px);padding-bottom:10px}
.gturn .ok{width:clamp(92px,min(46vw,20vh),210px);box-shadow:0 0 0 5px var(--paper),0 8px 0 5px rgba(6,10,50,.35)}
.gturn .no{width:clamp(58px,min(19vw,9vh),96px);margin-top:0;box-shadow:0 0 0 4px var(--paper),0 6px 0 4px rgba(6,10,50,.35)}
.giver-turn #c-num{font-family:var(--display);font-size:clamp(4rem,min(22vw,12vh),7rem);line-height:.9;color:var(--sun);text-shadow:0 6px 0 rgba(6,10,50,.5);font-variant-numeric:tabular-nums}
.giver-turn #c-num small{font-size:.5em;vertical-align:.7em}
.giver-turn .danger #c-num{color:var(--tomato)}
.giver-turn .danger .bar i{background:var(--tomato)}
.chrono .left{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.play-ico{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.play-ico svg{width:20px;height:20px;margin-left:3px}
.icon-btn{background:rgba(255,255,255,.1);border:0;border-radius:12px;min-height:44px;min-width:44px;padding:0 14px;font-weight:700;cursor:pointer;color:var(--fg)}

/* Setup */
.setup{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-bottom:24px}
.hero{display:flex;flex-direction:column;gap:12px;padding-top:8px;align-items:flex-start}
.logo{position:relative;display:inline-block}
.logo-main{font-family:var(--display);font-size:clamp(3.2rem,12vw,5.6rem);line-height:.95;color:var(--paper);text-shadow:0 6px 0 rgba(6,10,50,.45)}
.stamp{position:absolute;right:-14px;bottom:-12px;transform:rotate(-7deg);background:var(--sun);color:var(--ink);font-family:var(--display);font-size:1.15rem;padding:4px 12px;border-radius:8px;box-shadow:0 3px 0 rgba(6,10,50,.4)}
.tagline{color:var(--muted);max-width:52ch;font-size:1.05rem;margin-top:10px}
.panel{background:var(--bg-2);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line)}
.panel h2{font-family:var(--body);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.teams{display:flex;flex-direction:column;gap:10px}
.team-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.dot{width:40px;height:40px;border-radius:50%;background:var(--team);border:3px solid var(--paper);cursor:pointer;padding:0}
.field{width:100%;min-width:0;background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;color:var(--fg);font:inherit;font-size:1.1rem;min-height:52px;padding:0 14px}
.field:focus{border-color:var(--sun);outline:none}
textarea.field{min-height:130px;padding:12px 14px;resize:vertical;line-height:1.5}
.field::placeholder{color:rgba(243,245,255,.4)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt>span,.sub{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:48px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid transparent;font-weight:700;cursor:pointer;color:var(--fg)}
.seg button small{opacity:.65;font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:26px;height:26px;accent-color:var(--sun);flex:none;margin:0}
.avail{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.err{background:var(--tomato);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700}
.start{min-height:76px;font-size:1.8rem;width:100%}

/* Shared */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-label{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}
.center-col{flex:1;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px;padding-block:16px}
.titles{display:flex;flex-direction:column;align-items:center;gap:10px}
.mega{font-family:var(--display);font-size:clamp(3.2rem,13vw,6rem);line-height:1;color:var(--paper);text-shadow:0 6px 0 rgba(6,10,50,.45)}
.mega-sub{font-family:var(--display);font-size:clamp(1.8rem,7vw,3rem);line-height:1.1;color:var(--sun);text-shadow:0 4px 0 rgba(6,10,50,.45)}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function plural(n,w){return n+" "+w+(n>1?"s":"")}
function parseCustom(txt){
  const seen=new Set(),out=[];
  String(txt||"").split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(w=>{const k=w.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(w.slice(0,60))}});
  return out;
}
function save(){store.set(KEY,state)}
function total(i){return state.scores[i].reduce((a,b)=>a+b,0)}

/* ---------- sound ---------- */
let ac=null;
function audio(){
  if(!state.settings.sound)return null;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){return null}
  return ac;
}
function tone(f,d,type,vol,when){
  const a=audio();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);
    o.type=type||"sine";o.frequency.value=f;
    g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
const sfx={
  found(){tone(784,.12,"triangle",.22);tone(1175,.18,"triangle",.2,.08)},
  pass(){tone(330,.12,"triangle",.15)},
  tick(){tone(700,.06,"square",.07)},
  buzz(){tone(150,.8,"sawtooth",.25);tone(110,.8,"sawtooth",.18)},
  go(){tone(523,.1,"triangle",.2);tone(659,.1,"triangle",.2,.1);tone(784,.2,"triangle",.2,.2)}
};

let wl=null;
async function wake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){wl=null}}

/* ---------- deck ---------- */
function poolFor(s){const p=[];s.cats.forEach(c=>(WORDS[c]||[]).forEach(w=>p.push({w,c:CATS[c]})));return p}
function buildDeck(s){
  const custom=parseCustom(s.custom).map(w=>({w,c:"Perso"}));
  let cards=shuffle(custom).slice(0,s.cardCount);
  if(!s.customOnly){
    const taken=new Set(cards.map(c=>c.w.toLowerCase()));
    let used=new Set(store.get(USED)||[]);
    const pool=poolFor(s).filter(x=>!taken.has(x.w.toLowerCase()));
    const need=s.cardCount-cards.length;
    let fresh=pool.filter(x=>!used.has(x.w));
    if(fresh.length<need){
      const inPool=new Set(pool.map(p=>p.w));
      used=new Set([...used].filter(w=>!inPool.has(w)));
      fresh=pool;
    }
    const picked=shuffle(fresh).slice(0,need);
    picked.forEach(c=>used.add(c.w));
    store.set(USED,[...used]);
    cards=cards.concat(picked);
  }
  return shuffle(cards);
}
function availText(){
  const s=state.settings,c=parseCustom(s.custom).length;
  if(s.customOnly)return c?`${plural(c,"mot perso")} → partie de ${Math.min(c,s.cardCount)} cartes`:"Ajoute tes mots ci-dessus (un par ligne).";
  const p=poolFor(s).length;
  return `${p} mots dans le paquet${c?` + ${c} perso`:""} → partie de ${Math.min(p+c,s.cardCount)} cartes`;
}

  try{const q=qrcode(0,"M");q.addData(url);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return "QR indisponible"}
}
function lobbyDeck(){
  const seen=new Set(),out=[];
  const add=(w,c)=>{const k=w.toLowerCase();if(!seen.has(k)){seen.add(k);out.push({w,c})}};
  const nc=state.lobby.customs!=null?state.lobby.customs:2;
  Object.values(state.lobby.players).forEach(p=>{if(p.ready)p.picks.concat(p.custom.slice(0,nc)).forEach(w=>add(w,"Joueurs"))});
  parseCustom(state.settings.custom).forEach(w=>add(w,"Perso"));
  return out;
}

/* ---------- render ---------- */
function render(){
  const s=state.screen;
  app.className=s==="turn"?"fill":(s==="lobby"?"scroll lobbymode":"scroll");

/* ---------- host networking ---------- */
const net={peer:null,conns:new Map(),status:"off",err:"",retries:0,reopening:false};
async function hostStart(){
  if(!ONLINE||ROLE!=="host")return;
  if(!state.code){state.code=makeCode();save()}
  state.online=true;
  loadScript(LIBS.qr).then(rerenderNet).catch(()=>{});
  if(net.peer)return;
  net.status="connecting";
  try{await loadScript(LIBS.peer)}catch(e){net.status="error";net.err="Module de connexion introuvable. Vérifie internet.";rerenderNet();return}
  openHostPeer();
}
function reopenHost(delay){
  if(net.reopening)return;net.reopening=true;
  try{net.peer&&net.peer.destroy()}catch(e){}
  net.peer=null;
  setTimeout(()=>{net.reopening=false;openHostPeer()},delay);
}
function openHostPeer(){
  if(net.peer||!window.Peer)return;
  const peer=new Peer(PEER_PREFIX+state.code,{debug:0});
  net.peer=peer;
  peer.on("open",()=>{net.status="on";net.retries=0;rerenderNet()});
  peer.on("connection",conn=>{
    conn.on("open",()=>{net.conns.set(conn.peer,{conn,pid:null});sendTo(conn,hostConfig());sendTo(conn,tickMsg());rerenderNet()});
    conn.on("data",d=>onHostData(conn,d));
    conn.on("close",()=>{
      const c=net.conns.get(conn.peer);
      if(c&&c.pid&&state.lobby&&state.lobby.players[c.pid])state.lobby.players[c.pid].online=false;
      net.conns.delete(conn.peer);
      // The phone holding the cards dropped: stop the chrono and let the tablet decide (wait for it, or play on the tablet).
      const t=state.turn;
      if(c&&state.screen==="turn"&&t&&t.onPhone&&t.giver===c.pid&&!pidOnline(c.pid)){pauseTurn();render();return}
      rerenderNet();
    });
    conn.on("error",()=>{});
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable")return;
    if(e.type==="unavailable-id"&&net.retries<10){net.retries++;net.status="connecting";reopenHost(3000);return}
    net.status="error";
    net.err=e.type==="unavailable-id"?"Ce code de salle est déjà pris. Recharge la page.":"Connexion perdue, nouvel essai…";
    rerenderNet();
    if(e.type!=="unavailable-id")reopenHost(4000);
  });
}
// Re-render the tablet when phones come and go, on the screens that show who is connected.
function rerenderNet(){
  if(ROLE!=="host")return;
  const s=state.screen;
  if(s==="lobby"||ui.phones||((s==="ready"||s==="roundIntro")&&state.phoneTurns)||(s==="turn"&&state.turn&&state.turn.paused&&state.turn.onPhone))render();
}
function sendTo(conn,msg){try{if(conn&&conn.open)conn.send(msg)}catch(e){}}
function broadcast(msg){if(!net.peer||ROLE!=="host")return;net.conns.forEach(c=>sendTo(c.conn,msg))}
function broadcastTick(){if(!net.peer||ROLE!=="host")return;net.conns.forEach(c=>sendTo(c.conn,tickMsg(c.pid)))}
function hostConfig(){
  const taken=[];
  if(state.lobby)Object.values(state.lobby.players).forEach(p=>taken.push(...p.picks));
  const L=state.lobby||{};
  return {t:"config",gid:L.gid||null,per:L.per||10,customs:L.customs!=null?L.customs:2,cats:state.settings.cats,taken:taken.slice(0,120)};
}
function tickMsg(pid){
  const m=baseTick(pid);
  if(pid&&pid===state.admin)m.adm=adminInfo();
  return m;
}
/* What the admin's phone needs to drive the tablet from afar */
function adminInfo(){
  const s=state.screen,t=state.turn,L=state.lobby,g=giverOf();
  const a={screen:s,round:state.round||1};
  if(s==="lobby"&&L){
    a.lobby={per:L.per,customs:L.customs,giverPhones:!!L.giverPhones,n:lobbyDeck().length,teams:lobbyTeams(),
      players:Object.entries(L.players).map(([pid,p])=>({pid,name:p.name||"…",team:p.team||0,ready:!!p.ready,n:p.n||0,online:!!p.online}))};
  }
  if(state.teams){a.team=(state.teams[state.teamIdx]||{}).name;a.scores=state.teams.map((x,i)=>({name:x.name,color:x.color,total:total(i)}))}
  if((s==="roundIntro"||s==="ready")&&g)a.canTablet=true;
  if((s==="roundIntro"||s==="ready")&&!g)a.tabletGo=true;
  if(s==="lobby"&&L&&L.giverPhones)a.lobby.emptyTeams=emptyLobbyTeams();
  if(s==="turn"&&t){a.paused=!!t.paused;a.onPhone=!!t.onPhone;a.giverOnline=!!(t.giver&&pidOnline(t.giver))}
  if(s==="turnEnd"&&t)a.rows=t.rows.map(r=>({w:state.deck[r.i].w,ok:r.ok,last:!!r.last}));
  return a;
}
function emptyLobbyTeams(){
  const n=lobbyTeams().map(()=>0);
  Object.values(state.lobby.players).forEach(p=>{if(p.name&&n[p.team||0]!=null)n[p.team||0]++});
  return lobbyTeams().filter((_,i)=>!n[i]).map(t=>t.name);
}
const ADMIN_ACTS={lobby:["per","customs","giverMode","pteam","kick","lobbyStart"],roundIntro:["goTablet","go"],ready:["goTablet","go"],
  turn:["pause","resume","takeoverTablet"],turnEnd:["toggleRow","confirmTurn"],roundEnd:["nextRound"],gameEnd:["rematch","newGame"]};
function adminAct(pid,d){
  if(!pid||pid!==state.admin)return;
  const s=state.screen,a=String(d.a||"");
  if(a==="quit"){if(s!=="setup"&&s!=="lobby")resetGame();return}
  if(!(ADMIN_ACTS[s]||[]).includes(a))return;
  if(a==="takeoverTablet"&&!(state.turn&&state.turn.paused))return;
  hostAct(a,{dataset:{v:d.v==null?"":String(d.v),pid:cleanStr(d.target,40),i:d.i==null?"":String(d.i)}});
}
function baseTick(pid){
  const s=state.screen;
  const phase=(s==="setup"||s==="lobby")?"lobby":(s==="gameEnd"?"end":"game");
  const m={t:"tick",phase,screen:s};
  if(phase==="lobby"){
    const L=state.lobby,p=L&&pid&&L.players[pid];
    if(s==="lobby"&&L&&L.giverPhones&&p){const tm=lobbyTeams()[p.team||0];if(tm)m.myTeam=tm}
    return m;
  }
  if(!state.teams)return m;
  const team=state.teams[state.teamIdx]||state.teams[0],t=state.turn;
  let left=null,running=false;
  if(s==="turn"&&t){running=!t.paused;left=t.paused?t.left:Math.max(0,t.endsAt-Date.now())}
  const giver=giverOf();
  Object.assign(m,{team:team.name,color:team.color,round:state.round,roundTitle:ROUNDS[(state.round||1)-1].title,
    running,left,dur:(state.duration||30)*1000,reason:t?t.reason:null,
    cardsLeft:(state.pile?state.pile.length:0)+(t?t.rows.filter(r=>!r.ok).length:0),
    giverName:giver&&state.roster[giver]?state.roster[giver].name:"",
    scores:state.teams.map((x,i)=>({name:x.name,color:x.color,total:total(i)}))});
  // Only the player holding the cards ever receives the word.
  if(pid&&giver===pid){
    m.me=true;
    if(s==="turn"&&t&&t.onPhone&&t.giver===pid&&state.pile.length){m.card=state.deck[state.pile[0]].w;m.seq=t.seq;m.paused=t.paused}
  }
  return m;
}
function handleAct(pid,d){
  const g=giverOf();if(!g||pid!==g)return;
  const s=state.screen,t=state.turn;
  if(d.a==="go"&&(s==="roundIntro"||s==="ready"))startTurn();
  else if((d.a==="found"||d.a==="pass")&&s==="turn"&&t&&t.onPhone&&!t.paused&&d.seq===t.seq)(d.a==="found"?doFound:doPass)();
  // Corrections and validation at the end of a turn happen on the tablet only.
}
function onHostData(conn,d){
  if(!d||typeof d!=="object")return;
  const pid=cleanStr(d.pid,40);if(!pid)return;
  const c=net.conns.get(conn.peer);
  if(c&&c.pid!==pid){c.pid=pid;sendTo(conn,tickMsg(pid));rerenderNet()}
  if(d.t==="act"){handleAct(pid,d);return}
  if(d.t==="admin"){adminAct(pid,d);return}
  if(d.t==="chrono"||!state.lobby||state.screen!=="lobby")return;
  const L=state.lobby;
  if(d.gid&&d.gid!==L.gid)return;
  if(d.t==="hello"&&!L.players[pid])return;
  const p=L.players[pid]||(L.players[pid]={name:"",picks:[],custom:[],ready:false,n:0,team:emptiestTeam()});
  p.online=true;
  const name=cleanStr(d.name,24);if(name)p.name=name;
  if(d.t==="progress"){p.n=Math.max(0,Math.min(+d.n||0,99));p.ready=false}
  if(d.t==="words"){p.picks=cleanArr(d.picks,12,60);p.custom=cleanArr(d.custom,3,60);p.n=p.picks.length;p.ready=true}
  save();broadcast(hostConfig());rerenderNet();broadcastTick();
}

/* ---------- timer ---------- */
let lastSec=null;
function updateTimer(){
  if(state.screen!=="turn"||!state.turn)return;
  const num=document.getElementById("t-num"),bar=document.getElementById("t-bar"),box=document.getElementById("timer");
  if(!num)return;
  const left=state.turn.left,sec=Math.ceil(left/1000);
  num.innerHTML=sec+"<small>″</small>";
  bar.style.width=Math.max(0,left/(state.duration*1000)*100)+"%";
  box.classList.toggle("danger",sec<=5);
}
setInterval(()=>{
  if(state.screen!=="turn"||!state.turn||state.turn.paused||ui.menu||ui.rules)return;
  const left=state.turn.endsAt-Date.now();
  state.turn.left=Math.max(0,left);
  updateTimer();
  const sec=Math.ceil(left/1000);
  if(sec!==lastSec){lastSec=sec;if(sec<=5&&sec>0)sfx.tick();save();broadcastTick()}
  if(left<=0)endTurn("time");
},100);
function pauseTurn(){const t=state.turn;if(!t||t.paused)return;t.left=Math.max(0,t.endsAt-Date.now());t.paused=true}
function resumeTurn(){const t=state.turn;if(!t)return;t.paused=false;t.endsAt=Date.now()+t.left}

/* ---------- game actions ---------- */
function startGame(deckOverride){
  const s=state.settings;
  if(!deckOverride&&ONLINE&&s.phones){
    const prev=state.lobby||{};
    state.lobby={per:s.lobbyPer||prev.per||10,customs:s.lobbyCustoms!=null?s.lobbyCustoms:(prev.customs!=null?prev.customs:2),giverPhones:!!s.lobbyGiverPhones,players:{},gid:makeCode()+Date.now().toString(36)};
    state.screen="lobby";ui.err="";hostStart();window.scrollTo(0,0);render();broadcast(hostConfig());return;
  }
  const teams=s.teams.map((t,i)=>({name:(t.name||"").trim()||("Équipe "+(i+1)),color:t.color}));
  const deck=deckOverride||buildDeck(s);
  if(deck.length<5){ui.err="Il faut au moins 5 mots pour jouer : coche une catégorie ou ajoute tes mots.";render();return}
  ui.err="";
  // Phone turns: each team gets the list of players whose phone will hold the cards, in turn.
  const L=state.lobby,phoneTurns=!!(deckOverride&&L&&L.giverPhones);
  const roster={};
  teams.forEach(t=>t.players=[]);
  if(phoneTurns)Object.entries(L.players).forEach(([pid,p])=>{if(!p.name)return;roster[pid]={name:p.name};(teams[p.team||0]||teams[0]).players.push(pid)});
  Object.assign(state,{screen:"roundIntro",teams,deck,pile:shuffle(deck.map((_,i)=>i)),round:1,
    teamIdx:Math.floor(Math.random()*teams.length),scores:teams.map(()=>[0,0,0]),turn:null,duration:s.duration,
    phoneTurns,roster,giverIdx:teams.map(()=>0)});
  window.scrollTo(0,0);render();
}
function startTurn(forceTablet){
  const ms=state.duration*1000,g=giverOf();
  state.turn={rows:[],left:ms,endsAt:Date.now()+ms,paused:false,reason:null,seq:0,giver:g,onPhone:!forceTablet&&!!(g&&pidOnline(g))};
  state.screen="turn";lastSec=null;ui.confirmTablet=false;
  sfx.go();wake();render();
}
function doFound(){
  const t=state.turn;if(!t||t.paused)return;
  const idx=state.pile.shift();setRow(idx,true);t.seq++;sfx.found();
  if(!state.pile.length)endTurn("empty");else render();
}
function doPass(){
  const t=state.turn;if(!t||t.paused)return;
  // Skipped cards leave the pile until the end of the turn: they don't come back this turn.
  const idx=state.pile.shift();setRow(idx,false);t.seq++;sfx.pass();
  if(!state.pile.length)endTurn("empty");else render();
}
function setRow(idx,ok,last){
  const rows=state.turn.rows,r=rows.find(x=>x.i===idx);
  if(r){r.ok=ok;r.last=!!last}else rows.push({i:idx,ok,last:!!last});
}
function endTurn(reason){
  const t=state.turn;t.reason=reason;t.left=0;t.paused=false;ui.confirmTablet=false;
  if(reason==="time"&&state.pile.length)setRow(state.pile[0],false,true);
  if(reason==="time")sfx.buzz();
  state.screen="turnEnd";render();
}
function confirmTurn(){
  const t=state.turn;let pts=0;ui.confirmTablet=false;
  t.rows.forEach(r=>{
    if(r.ok){state.pile=state.pile.filter(x=>x!==r.i);pts++}
    else if(!state.pile.includes(r.i))state.pile.push(r.i);
  });
  state.scores[state.teamIdx][state.round-1]+=pts;
  if(state.phoneTurns)state.giverIdx[state.teamIdx]=(state.giverIdx[state.teamIdx]||0)+1;
  state.pile=shuffle(state.pile);
  state.teamIdx=(state.teamIdx+1)%state.teams.length;
  state.turn=null;
  state.screen=state.pile.length?"ready":"roundEnd";
  window.scrollTo(0,0);render();
}
function resetGame(){
  state={screen:"setup",settings:state.settings,code:state.code,online:state.online,admin:state.admin};
  ui={menu:false,rules:false,confirmQuit:false,err:"",shake:false,phones:false};
  render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  if(e.target.closest("[data-stop]")&&el.matches(".overlay"))return;
  hostAct(el.dataset.act,el);
});
/* Every tablet action, callable from a tap on the tablet or from the admin's phone */
function hostAct(act,el){
  const s=state.settings;
  switch(act){
    case "setAdmin":{const pid=el.dataset.pid;state.admin=state.admin===pid?null:pid;render();break}
    case "rules":ui.rules=true;ui.menu=false;render();break;
    case "closeRules":ui.rules=false;render();break;
    case "menu":if(state.screen==="turn")pauseTurn();ui.menu=true;ui.confirmQuit=false;render();break;
    case "closeMenu":ui.menu=false;ui.confirmQuit=false;render();break;
    case "sound":s.sound=!s.sound;render();if(s.sound)sfx.found();break;
    case "quit":if(!ui.confirmQuit){ui.confirmQuit=true;render()}else resetGame();break;
    case "addTeam":{
      const usedC=s.teams.map(t=>t.color),usedN=s.teams.map(t=>t.name);
      s.teams.push({name:TEAM_NAMES.find(n=>!usedN.includes(n))||("Équipe "+(s.teams.length+1)),color:COLORS.find(c=>!usedC.includes(c))||COLORS[0]});
      render();break;
    }
    case "delTeam":s.teams.splice(+el.dataset.i,1);render();break;
    case "color":{
      const i=+el.dataset.i,usedC=s.teams.filter((_,j)=>j!==i).map(t=>t.color);
      let k=COLORS.indexOf(s.teams[i].color);
      for(let n=0;n<COLORS.length;n++){k=(k+1)%COLORS.length;if(!usedC.includes(COLORS[k]))break}
      s.teams[i].color=COLORS[k];render();break;
    }
    case "cards":s.cardCount=+el.dataset.v;render();break;
    case "dur":s.duration=+el.dataset.v;render();break;
    case "cat":{const k=el.dataset.k;s.cats=s.cats.includes(k)?s.cats.filter(x=>x!==k):s.cats.concat(k);render();break}
    case "start":startGame();break;
    case "per":state.lobby.per=s.lobbyPer=+el.dataset.v;render();broadcast(hostConfig());break;
    case "customs":state.lobby.customs=s.lobbyCustoms=+el.dataset.v;render();broadcast(hostConfig());break;
    case "kick":delete state.lobby.players[el.dataset.pid];render();broadcast(hostConfig());break;
    case "lobbyBack":state.screen="setup";render();break;
    case "lobbyStart":{const d=lobbyDeck();if(d.length>=5)startGame(shuffle(d));break}
    case "phones":ui.menu=false;ui.phones=true;hostStart();render();break;
    case "closePhones":ui.phones=false;render();break;
    case "go":if(!giverOf())startTurn();break;
    case "found":doFound();break;
    case "pass":doPass();break;
    case "askTablet":ui.confirmTablet=true;render();break;
    case "cancelTablet":ui.confirmTablet=false;render();break;
    case "goTablet":if(state.screen==="ready"||state.screen==="roundIntro")startTurn(true);break;
    case "takeoverTablet":if(state.turn){state.turn.onPhone=false;ui.confirmTablet=false;render()}break;
    case "giverMode":state.lobby.giverPhones=s.lobbyGiverPhones=el.dataset.v==="1";render();broadcastTick();break;
    case "pteam":{const p=state.lobby.players[el.dataset.pid];if(p){p.team=((p.team||0)+1)%lobbyTeams().length;render();broadcastTick()}break}
    case "pause":pauseTurn();render();break;
    case "resume":resumeTurn();render();break;
    case "toggleRow":{const r=state.turn&&state.turn.rows[+el.dataset.i];if(r){r.ok=!r.ok;render()}break}
    case "confirmTurn":confirmTurn();break;
    case "nextRound":
      ui.confirmTablet=false;
      if(state.round>=3){state.screen="gameEnd";render();break}
      state.round++;state.pile=shuffle(state.deck.map((_,i)=>i));state.screen="roundIntro";window.scrollTo(0,0);render();break;
    case "rematch":
      state.round=1;state.scores=state.teams.map(()=>[0,0,0]);state.pile=shuffle(state.deck.map((_,i)=>i));
      state.teamIdx=Math.floor(Math.random()*state.teams.length);state.screen="roundIntro";render();break;
    case "newGame":resetGame();break;
  }
}
document.addEventListener("input",e=>{
  const el=e.target,s=state.settings;
  if(el.dataset&&el.dataset.team!=null){s.teams[+el.dataset.team].name=el.value;save()}
  else if(el.id==="custom"){s.custom=el.value;const a=document.getElementById("avail");if(a)a.textContent=availText();save()}
});
document.addEventListener("change",e=>{
  const el=e.target,s=state.settings;
  if(el.id==="customOnly"){s.customOnly=el.checked;const a=document.getElementById("avail");if(a)a.textContent=availText();save()}
  else if(el.id==="phones"){s.phones=el.checked;save()}
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){if(state.screen==="turn"&&state.turn&&!state.turn.paused){pauseTurn();render()}}
  else if(state.screen!=="setup")wake();
});

/* ---------- phone app (?p=CODE to pick words, ?c=CODE for the table chrono) ---------- */
const PKEY="tu-phone-"+ROOM;
let ph, pn={peer:null,conn:null,status:"connecting",config:null,tick:null,tickAt:0,wasRunning:false};
function psave(){store.set(PKEY,ph)}
function ppool(){
  const cats=(pn.config&&Array.isArray(pn.config.cats)&&pn.config.cats.length)?pn.config.cats:["celeb","persos","trucs","lieux"];
  const taken=new Set(((pn.config&&pn.config.taken)||[]).concat(ph.picks).map(w=>String(w).toLowerCase()));
  const all=[];cats.forEach(c=>(WORDS[c]||[]).forEach(w=>all.push(w)));
  const free=all.filter(w=>!taken.has(w.toLowerCase()));
  return free.length>=2?free:all;
}
function newPair(){const p=shuffle(ppool());ph.pair=[p[0],p[1]];psave()}
function perPlayer(){return (pn.config&&+pn.config.per)||10}
function nCustoms(){const c=pn.config&&pn.config.customs;return c==null?2:Math.max(0,Math.min(3,+c||0))}
function psend(m){try{if(pn.conn&&pn.conn.open)pn.conn.send(Object.assign({pid:ph.pid,name:ph.name,gid:ph.gid||null},m))}catch(e){}}
function resetPhone(){ph.step="name";ph.picks=[];ph.custom=[];ph.pair=null;psave()}
function finishPicks(){
  ph.picks=ph.picks.slice(0,perPlayer());
  if(nCustoms()>0)ph.step="custom";
  else{ph.custom=[];ph.step="sent";sendWords()}
}
function sendWords(){psend({t:"words",picks:ph.picks,custom:ph.custom.filter(Boolean).slice(0,nCustoms())})}

function phoneView(){
  if(ROLE==="chrono")return "chrono";
  const t=pn.tick;
  if(t&&t.phase==="game"&&t.me){
    if(t.screen==="roundIntro"||t.screen==="ready")return "giver";
    if(t.screen==="turn"&&t.card)return "giver";
  }
  if(t&&t.phase!=="lobby")return "chrono";
  if(t&&t.screen==="setup")return "wait";
  if(!pn.config||!pn.config.gid)return pn.status==="on"?"wait":ph.step;
  return ph.step;
}
function pStatus(){
  const st=pn.status;
  if(st==="on")return `<span class="net on"><i></i>Connecté à la partie ${esc(ROOM)}</span>`;
  if(st==="nohost")return `<span class="net"><i></i>On cherche la tablette ${esc(ROOM)}…</span>`;
  if(st==="error")return `<span class="net err"><i></i>Connexion perdue, nouvel essai…</span>`;
  return `<span class="net"><i></i>Connexion…</span>`;
}
function vPhone(){
  const v=phoneView();
  if(v==="chrono")return vChrono();
  if(v==="giver")return vGiver();
  let body="";
  if(v==="wait"){
    body=`<div class="phone-main">
      <div class="waiting-dot" aria-hidden="true"></div>
      <h1>En attente d'une partie</h1>
      <p class="lead">Dès que la tablette ouvre une nouvelle partie, tu pourras choisir tes cartes ici. Pas besoin de rescanner.</p>
    </div>`;
  }else if(v==="name"){
    body=`<div class="phone-main">
      <h1>Time's Up maison</h1>
      <p class="lead">Ton prénom, pour que la tablette sache qui est prêt.</p>
      <input id="p-name" class="field" maxlength="24" placeholder="Ton prénom" value="${esc(ph.name)}" autocomplete="off" style="text-align:center;font-size:1.4rem;min-height:62px">
      <button class="btn btn-sun wide" data-act="pName">Choisir mes cartes</button>
    </div>`;
  }else if(v==="pick"){
    const per=perPlayer(),n=ph.picks.length;
    if(!ph.pair||!ph.pair[0])newPair();
    body=`<div class="phone-main">
      <p class="lead">Carte ${n+1} sur ${per}</p>
      <div class="progress"><i style="width:${n/per*100}%"></i></div>
      <h1>Laquelle tu mets dans le jeu ?</h1>
      <button class="pick-card" data-act="pick" data-i="0">${esc(ph.pair[0])}</button>
      <span class="or">ou</span>
      <button class="pick-card" data-act="pick" data-i="1">${esc(ph.pair[1])}</button>
      <button class="btn btn-ghost small" data-act="reroll">Je connais aucune des deux</button>
    </div>`;
  }else if(v==="custom"){
    const nc=nCustoms();
    body=`<div class="phone-main">
      <h1>Écris ${nc>1?nc+" cartes":"1 carte"} à toi</h1>
      <p class="lead">Un pote, une private joke, ce que tu veux. Les autres devront le faire deviner.</p>
      ${Array.from({length:nc},(_,i)=>`<input id="p-c${i}" class="field" maxlength="60" placeholder="Carte perso ${i+1}" value="${esc(ph.custom[i]||"")}" autocomplete="off">`).join("")}
      <button class="btn btn-sun wide" data-act="pSend">Envoyer mes cartes</button>
      <button class="btn btn-ghost small" data-act="pUndo">← Revenir aux choix</button>
    </div>`;
  }else{
    body=`<div class="phone-main">
      <div class="done-mark">${ICON.ok}</div>
      <h1>C'est envoyé !</h1>
      ${pn.tick&&pn.tick.myTeam?`<p class="lead">Tu joues avec</p><span class="pill" style="--team:${esc(pn.tick.myTeam.color)};background:var(--team);color:var(--ink);font-family:var(--display);font-size:1.6rem;padding:6px 18px;border-radius:999px;align-self:center">${esc(pn.tick.myTeam.name)}</span>`:""}
      <p class="lead">${pn.status==="on"?"Attends que la tablette lance la partie.":"Tes cartes partiront dès que la connexion revient."}</p>
      <div class="mini-list">${ph.picks.concat(ph.custom.filter(Boolean)).map(w=>`<span>${esc(w)}</span>`).join("")}</div>
      <button class="btn btn-ghost small" data-act="pRestart">Refaire mes choix</button>
    </div>`;
  }
  return `<div class="phone">${pStatus()}${body}</div>`;
}
function vChrono(){
  const t=pn.tick;
  let inner;
  if(!t||t.phase==="lobby"){
    inner=`<p class="big-msg">Chrono de table</p><p class="lead">Le chrono apparaîtra ici dès que la partie commence.</p>`;
  }else if(t.phase==="end"){
    const sc=(t.scores||[]).slice().sort((a,b)=>b.total-a.total);
    inner=`<p class="rt">Fin de partie</p><p class="big-msg">Bravo ${esc(sc[0]?sc[0].name:"")} !</p>
      <div class="mini-list">${sc.map(x=>`<span>${esc(x.name)} · ${x.total}</span>`).join("")}</div>`;
  }else if(t.screen==="turn"){
    inner=`<span class="pill" style="--team:${esc(t.color)}">${esc(t.team)}</span>
      <p class="rt">${t.giverName?esc(t.giverName)+" fait deviner":"Manche "+t.round+" · "+esc(t.roundTitle)}</p>
      <div id="c-num">${Math.ceil((t.left||0)/1000)}<small>″</small></div>
      <div class="bar"><i id="c-bar"></i></div>
      <p class="left">${plural(t.cardsLeft,"carte")} restante${t.cardsLeft>1?"s":""}${t.running?"":" · pause"}</p>`;
  }else if(t.screen==="turnEnd"){
    inner=`<span class="pill" style="--team:${esc(t.color)}">${esc(t.team)}</span><p class="big-msg ${t.reason==="time"?"bad":""}">${t.reason==="time"?"Temps écoulé !":"Plus de cartes !"}</p><p class="lead">On vérifie les cartes sur la tablette.</p>`;
  }else{
    inner=`<p class="rt">Manche ${t.round} · ${esc(t.roundTitle)}</p><p class="lead">Au tour de</p>
      <span class="pill" style="--team:${esc(t.color)};font-size:2rem">${esc(t.team)}</span>
      ${t.giverName?`<p class="lead">${esc(t.giverName)} fait deviner</p>`:""}
      <div class="mini-list">${(t.scores||[]).map(x=>`<span>${esc(x.name)} · ${x.total}</span>`).join("")}</div>`;
  }
  return `<div class="phone">${pStatus()}<div class="chrono" id="chrono">${inner}</div>
    ${phoneAudio?"":`<button class="btn btn-ghost small" data-act="pSound">Activer le son du buzzer</button>`}</div>`;
}
/* The phone holding the cards: Go, then the card with ✓ / ✗, then the turn recap */
function vGiver(){
  const t=pn.tick;
  if(t.screen==="turn"){
    // Rows: small header, timer, the card (takes the free height), then ✓ and ✗. Sized on the screen height so nothing overlaps.
    return `<div class="gturn" id="chrono">
      <header class="g-hud"><span class="g-team" style="--team:${esc(t.color)}">${esc(t.team)}</span><span class="g-round">${esc(t.roundTitle)}</span></header>
      <div class="g-timer"><span id="c-num">${Math.ceil((t.left||0)/1000)}<small>″</small></span><div class="bar"><i id="c-bar"></i></div></div>
      <div class="card g-card enter"><div class="word">${esc(t.card)}</div><span class="badge" aria-label="${t.cardsLeft} cartes restantes">${t.cardsLeft}</span></div>
      <div class="g-btns">
        <button class="round-btn ok" data-act="gFound" aria-label="Trouvé">${ICON.ok}</button>
        <button class="round-btn no" data-act="gPass" aria-label="Passer">${ICON.no}</button>
      </div>
      ${t.paused?`<div class="pause-layer"><h2>Pause</h2><p class="hint">Le chrono est arrêté sur la tablette.</p></div>`:""}
    </div>`;
  }
  return `<div class="phone">${pStatus()}<div class="phone-main">
    <p class="rt" style="font-family:var(--display);font-size:1.5rem;color:var(--sun)">Manche ${t.round} · ${esc(t.roundTitle)}</p>
    <h1>C'est toi qui fais deviner !</h1>
    <p class="lead">Mets-toi face à ton équipe, puis lance le chrono.</p>
    <button class="btn btn-team" style="--team:${esc(t.color)}" data-act="gGo"><small>${esc(t.team)}</small><strong>Go !</strong></button>
  </div></div>`;
}
/* Admin remote: a floating button on the admin's phone opens a panel that drives the tablet */
const pAdm={open:false,arm:null};
function renderAdmin(){
  const box=document.getElementById("adm");if(!box)return;
  const a=pn.tick&&pn.tick.adm;
  if(!a){box.innerHTML="";pAdm.open=false;return}
  // Hidden while this phone shows the cards, so it never covers them.
  const giving=phoneView()==="giver"&&pn.tick.screen==="turn";
  box.innerHTML=(giving||pAdm.open?"":`<button class="adm-fab" data-act="admOpen">${ICON.crown}Admin</button>`)+(pAdm.open?vAdminPanel(a):"");
}
function aBtn(a,label,cls){return `<button class="btn ${cls||"btn-ghost"} wide" data-act="adm" data-a="${a}">${label}</button>`}
function aConfirm(key,a,label,warn){
  if(pAdm.arm===key)return `<div class="confirm-box"><p><b>Sûr ?</b> ${warn}</p><div class="confirm-row"><button class="btn btn-tomato small" data-act="adm" data-a="${a}">Oui</button><button class="btn btn-ghost small" data-act="admDisarm">Annuler</button></div></div>`;
  return `<button class="btn btn-ghost wide" data-act="admArm" data-k="${key}">${label}</button>`;
}
function vAdminPanel(a){
  const s=a.screen;let body="";
  if(s==="setup"){
    body=`<p class="lead">La tablette est sur l'accueil. Lance une nouvelle partie depuis la tablette.</p>`;
  }else if(s==="lobby"&&a.lobby){
    const L=a.lobby;
    const segs=(key,opts,cur)=>`<div class="seg">${opts.map(([v,l])=>`<button data-act="adm" data-a="${key}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</div>`;
    body=`<div class="adm-sec">
      <div class="opt"><span>Cartes à choisir</span>${segs("per",[[5,5],[8,8],[10,10]],L.per)}</div>
      <div class="opt"><span>Cartes perso à écrire</span>${segs("customs",[[0,"Aucune"],[1,1],[2,2],[3,3]],L.customs)}</div>
      <div class="opt"><span>Cartes affichées sur</span>${segs("giverMode",[[0,"La tablette"],[1,"Les téléphones"]],L.giverPhones?1:0)}</div>
      <h3>Joueurs</h3>
      <ul class="adm-players">${L.players.map(p=>{
        const tm=L.teams[p.team]||L.teams[0],armed=pAdm.arm==="k"+p.pid;
        return `<li class="${p.ready?"ready":""}"><span class="pdot ${p.online?"on":""}"></span><b>${esc(p.name)}</b>
          ${L.giverPhones?`<button class="adm-team" style="--team:${esc(tm.color)}" data-act="adm" data-a="pteam" data-pid="${esc(p.pid)}">${esc(tm.name)}</button>`:""}
          <span class="st">${p.ready?"✓":p.n+"/"+L.per}</span>
          <button class="adm-kick ${armed?"arm":""}" data-act="${armed?"adm":"admArm"}" data-a="kick" data-pid="${esc(p.pid)}" data-k="k${esc(p.pid)}">${armed?"Retirer ?":"✕"}</button></li>`;
      }).join("")||`<li>Personne pour l'instant</li>`}</ul>
      ${L.giverPhones?`<p class="hint">Touche l'équipe d'un joueur pour le changer d'équipe.</p>`:""}
      ${L.emptyTeams&&L.emptyTeams.length?`<p class="who warn">${L.emptyTeams.map(esc).join(", ")} : aucun joueur, ses tours se joueront sur la tablette.</p>`:""}
      <button class="btn btn-sun wide" data-act="adm" data-a="lobbyStart" ${L.n<5?"disabled":""}>Lancer la partie · ${plural(L.n,"carte")}</button>
    </div>`;
  }else{
    if(s==="roundIntro"||s==="ready")body+=`<p class="lead">Manche ${a.round} · au tour de <b>${esc(a.team||"")}</b></p>`
      +(a.canTablet?aConfirm("tab","goTablet","Jouer ce tour sur la tablette","Les cartes vont s'afficher sur la tablette, tout le monde pourra les voir."):"")
      +(a.tabletGo?aBtn("go","Lancer le chrono (cartes sur la tablette)","btn-sun"):"");
    if(s==="turn")body+=a.paused
      ?aBtn("resume","Reprendre","btn-sun")+(a.onPhone&&!a.giverOnline?aConfirm("take","takeoverTablet","Jouer ce tour sur la tablette","Les cartes vont s'afficher sur la tablette, tout le monde pourra les voir."):"")
      :aBtn("pause","Pause","btn-sun");
    if(s==="turnEnd"&&a.rows)body+=`<div class="recap">${a.rows.map((r,i)=>`<button class="tr ${r.ok?"is-ok":(r.last?"is-last":"is-no")}" data-act="adm" data-a="toggleRow" data-i="${i}"><span>${esc(r.w)}</span><i>${r.ok||r.last?ICON.ok:ICON.no}</i></button>`).join("")||`<p class="lead">Aucune carte ce tour-ci.</p>`}</div>
      <p class="hint">Touche une carte pour corriger.</p>`+aBtn("confirmTurn",`Valider · +${plural(a.rows.filter(r=>r.ok).length,"point")}`,"btn-sun");
    if(s==="roundEnd")body+=aBtn("nextRound",a.round<3?"Manche suivante":"Résultat final","btn-sun");
    if(s==="gameEnd")body+=aBtn("rematch","Revanche, mêmes cartes","btn-sun")+aBtn("newGame","Nouvelle partie");
    if(a.scores)body+=`<div class="adm-scores">${a.scores.map(x=>`<span>${esc(x.name)} · ${x.total}</span>`).join("")}</div>`;
    if(s!=="gameEnd")body+=aConfirm("quit","quit","Abandonner la partie","La partie en cours sera perdue et la tablette revient à l'accueil.");
  }
  return `<div class="overlay" data-act="admClose"><div class="sheet" data-stop>
    <h2>Admin</h2><p class="hint">Tu pilotes la tablette depuis ton téléphone.</p>
    ${body}
    <button class="btn btn-ghost" data-act="admClose">Fermer</button>
  </div></div>`;
}
let phoneAudio=false;
function prender(){
  const v=phoneView();
  app.className=(v==="giver"&&pn.tick&&pn.tick.screen==="turn")?"fill gmode":"scroll";
  pn.lock=false;
  app.innerHTML=vPhone();pUpdateTimer();renderAdmin();
}
function pLeft(){const t=pn.tick;if(!t||t.left==null)return 0;return Math.max(0,t.running?t.left-(Date.now()-pn.tickAt):t.left)}
function pUpdateTimer(){
  const num=document.getElementById("c-num");if(!num)return;
  const t=pn.tick,left=pLeft(),sec=Math.ceil(left/1000);
  num.innerHTML=sec+"<small>″</small>";
  const bar=document.getElementById("c-bar");if(bar)bar.style.width=Math.max(0,left/(t.dur||30000)*100)+"%";
  const box=document.getElementById("chrono");if(box)box.classList.toggle("danger",sec<=5);
}
function onPhoneData(d){
  if(!d||typeof d!=="object")return;
  if(d.t==="config"){
    const before=phoneView();
    pn.config=d;
    // A new game on the tablet: everything chosen for the previous one is wiped.
    if(d.gid&&ph.gid!==d.gid){
      const had=!!ph.gid;ph.gid=d.gid;
      if(had||ph.step!=="name")resetPhone();
      psave();prender();
      if(ph.name)psend({t:"progress",n:0});
      return;
    }
    if(ph.step==="pick"&&ph.picks.length>=perPlayer()){finishPicks();psave();prender();return}
    if(before!==phoneView()){prender();return}
    if(ph.pair&&((d.taken||[]).map(w=>String(w).toLowerCase()).some(w=>w===String(ph.pair[0]).toLowerCase()||w===String(ph.pair[1]).toLowerCase()))){newPair();if(phoneView()==="pick")prender()}
    if(phoneView()==="pick")prender();
    return;
  }
  if(d.t==="tick"){
    const before=phoneView();
    if(pn.wasRunning&&d.screen==="turnEnd"&&d.reason==="time")sfx.buzz();
    pn.wasRunning=d.screen==="turn"&&d.running;
    pn.tick=d;pn.tickAt=Date.now();
    const admSig=JSON.stringify(d.adm||null);
    if(admSig!==pn.admSig){pn.admSig=admSig;renderAdmin()}
    const after=phoneView();
    // Re-render only when something visible changed (never on the name / pick / custom screens, which hold inputs).
    const live=["chrono","giver","sent","wait"].includes(after);
    const sig=after+"|"+(live?JSON.stringify([d.screen,d.card,d.seq,d.rows,d.paused,d.cardsLeft,d.running,d.team,d.giverName,d.myTeam&&d.myTeam.name,d.reason,d.phase]):"");
    if(sig!==pn.sig||before!==after){pn.sig=sig;prender()}
    else pUpdateTimer();
  }
}
async function phoneConnect(){
  try{await loadScript(LIBS.peer)}catch(e){pn.status="error";prender();setTimeout(phoneConnect,4000);return}
  openPhonePeer();
}
function openPhonePeer(){
  const peer=new Peer({debug:0});pn.peer=peer;
  peer.on("open",connectHost);
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){pn.status="nohost";prender();setTimeout(connectHost,3000);return}
    if(["network","server-error","socket-error","socket-closed"].includes(e.type)){
      pn.status="error";prender();try{peer.destroy()}catch(_){}
      pn.peer=null;setTimeout(openPhonePeer,4000);
    }
  });
}
function connectHost(){
  if(!pn.peer||pn.peer.destroyed||!pn.peer.open)return;
  if(pn.conn&&pn.conn.open)return;
  const conn=pn.peer.connect(PEER_PREFIX+ROOM,{reliable:true});pn.conn=conn;
  conn.on("open",()=>{
    pn.status="on";
    // Always say hello first so the tablet knows which player this phone is (needed for phone turns).
    if(ROLE!=="chrono")psend({t:"hello"});
    if(ROLE==="chrono")psend({t:"chrono"});
    else if(ph.step==="sent")sendWords();
    else if(ph.step!=="name")psend({t:"progress",n:ph.picks.length});
    prender();
  });
  conn.on("data",onPhoneData);
  conn.on("close",()=>{if(pn.conn===conn){pn.conn=null;pn.status="connecting";prender();setTimeout(connectHost,2000)}});
  conn.on("error",()=>{});
}
function phoneBoot(){
  state={settings:{sound:true}};
  ph=store.get(PKEY)||{};
  ph=Object.assign({pid:"p"+Math.random().toString(36).slice(2,10),name:"",step:"name",picks:[],custom:["",""],pair:null},ph);
  if(!Array.isArray(ph.custom))ph.custom=["",""];
  psave();
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-act]");if(!el)return;
    if(e.target.closest("[data-stop]")&&el.matches(".overlay"))return;
    phoneAudio=true;audio();
    switch(el.dataset.act){
      case "pName":{const v=cleanStr((document.getElementById("p-name")||{}).value||"",24);if(!v){document.getElementById("p-name").focus();return}
        ph.name=v;ph.step="pick";newPair();psave();psend({t:"progress",n:ph.picks.length});prender();break}
      case "pick":{const w=ph.pair[+el.dataset.i];if(w&&!ph.picks.includes(w))ph.picks.push(w);
        if(ph.picks.length>=perPlayer())finishPicks();else newPair();
        psave();if(ph.step!=="sent")psend({t:"progress",n:ph.picks.length});sfx.found();prender();break}
      case "reroll":newPair();prender();break;
      case "pSend":ph.custom=Array.from({length:nCustoms()},(_,i)=>{const f=document.getElementById("p-c"+i);return f?cleanStr(f.value,60):""});
        ph.step="sent";psave();sendWords();prender();break;
      case "pUndo":ph.step="pick";ph.picks.pop();newPair();psave();psend({t:"progress",n:ph.picks.length});prender();break;
      case "pRestart":ph.step="pick";ph.picks=[];newPair();psave();psend({t:"progress",n:0});prender();break;
      case "pSound":sfx.found();prender();break;
      case "admOpen":pAdm.open=true;pAdm.arm=null;renderAdmin();break;
      case "admClose":pAdm.open=false;pAdm.arm=null;renderAdmin();break;
      case "admArm":pAdm.arm=el.dataset.k;renderAdmin();break;
      case "admDisarm":pAdm.arm=null;renderAdmin();break;
      case "adm":{
        const d=el.dataset;
        // "target" is the player the admin acts on; "pid" stays this phone's own id.
        psend({t:"admin",a:d.a,v:d.v==null?null:d.v,target:d.pid||"",i:d.i==null?null:d.i});
        pAdm.arm=null;renderAdmin();break;
      }
      case "gGo":psend({t:"act",a:"go"});break;
      case "gFound":case "gPass":{
        if(pn.lock||!pn.tick||pn.tick.paused)return;
        pn.lock=true;setTimeout(()=>{pn.lock=false},1500);
        const a=el.dataset.act==="gFound"?"found":"pass";
        psend({t:"act",a,seq:pn.tick.seq});
        if(a==="found")sfx.found();else sfx.pass();
        break;
      }
    }
  });
  document.addEventListener("input",e=>{const m=/^p-c(\d)$/.exec(e.target.id);if(m){ph.custom[+m[1]]=e.target.value;psave()}else if(e.target.id==="p-name"){ph.name=e.target.value;psave()}});
  setInterval(()=>{if(phoneView()==="chrono")pUpdateTimer()},100);
  async function lock(){try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}}
  lock();document.addEventListener("visibilitychange",()=>{if(!document.hidden)lock()});
  prender();
  if(!ROOM){app.innerHTML=`<div class="phone"><div class="phone-main"><h1>Code de partie manquant</h1><p class="lead">Scanne à nouveau le QR code de la tablette.</p></div></div>`;return}
  phoneConnect();
}

/* ---------- boot ---------- */
function start(data){
  let st=(data&&data.state)||store.get(KEY);
  if(!st||!st.settings||!st.screen)st=initial();
  st.settings=Object.assign(defaults(),st.settings);
  if(st.turn&&!st.turn.rows){st.turn=null;if(st.screen==="turn"||st.screen==="turnEnd")st.screen="ready"}
  if(st.screen==="ready"&&st.round===undefined)st.screen="setup";
  if(st.screen==="turn"&&st.turn)st.turn.paused=true;
  if(st.screen==="lobby"){if(!st.lobby||!st.code)st={screen:"setup",settings:st.settings}}
  else if(st.screen!=="setup"&&(!st.deck||!st.teams))st={screen:"setup",settings:st.settings,code:st.code,online:st.online,admin:st.admin};
  state=st;
  render();
  if(ONLINE&&(state.screen==="lobby"||state.online))hostStart();
}
if(ROLE!=="host"&&ONLINE){phoneBoot()}
else{
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state}))}catch(e){}
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
}
})();
</script>
