<meta charset="utf-8">
<!-- Time's Up nocca · v1.26 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B2A8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Time's Up nocca</title>
<meta name="apple-mobile-web-app-title" content="Time's Up">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-screen party game. Setup scrolls; the turn screen fills the viewport: giant timer, the card, a giant ✓ and a smaller ✗ under the thumb. Landscape puts timer+card left, buttons right. Single committed look: cobalt table, paper cards. */
:root{
  --bg:#1B2A8C;
  --bg-2:#24379E;
  --line:rgba(255,255,255,.16);
  --fg:#F3F5FF;
  --muted:#B3BCF2;
  --paper:#FFFBF0;
  --ink:#141A3A;
  --sun:#FFC93C;
  --mint:#3DDC97;
  --tomato:#FF5B47;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.07) 1.4px,transparent 1.6px);
  background-size:22px 22px;
  color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
#app{
  display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.ver{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:60;pointer-events:none;
  font:700 .72rem/1 var(--body);letter-spacing:.06em;color:var(--muted);opacity:.55;font-variant-numeric:tabular-nums}
.standalone #app{padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.waiting-dot{width:72px;height:72px;margin:0 auto;border-radius:50%;border:8px solid rgba(255,255,255,.15);border-top-color:var(--sun);animation:spin 1s linear infinite}
#app.scroll{min-height:100%}
#app.fill{height:100%;min-height:520px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
svg{display:block}

/* Buttons */
.btn{
  font-family:var(--display);font-size:1.35rem;letter-spacing:.01em;
  border:0;border-radius:18px;min-height:62px;padding:0 24px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  box-shadow:0 5px 0 rgba(6,10,50,.4);
  transition:transform .06s ease,box-shadow .06s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center;
  line-height:1.1;padding-block:10px;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(6,10,50,.4)}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line)}
.btn-ghost:active{box-shadow:inset 0 0 0 2px var(--line)}
.btn-tomato{background:var(--tomato);color:#fff}
.btn.small{min-height:46px;font-size:1.05rem;padding:0 18px;border-radius:14px}
.btn.wide{width:100%}
.btn-team{
  position:relative;overflow:hidden;
  background:var(--team);color:var(--ink);
  min-height:96px;width:100%;max-width:560px;border-radius:24px;padding:12px 28px;
  flex-direction:column;gap:2px;
  box-shadow:0 0 0 5px var(--paper),0 10px 0 5px rgba(6,10,50,.45);
}
.intro .btn-team{margin-bottom:clamp(28px,9vh,96px)}
.btn-team:active{box-shadow:0 0 0 5px var(--paper),0 4px 0 5px rgba(6,10,50,.45)}
.btn-team small{position:relative;font-family:var(--body);font-weight:800;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.btn-team strong{position:relative;font-weight:400;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.05;overflow-wrap:anywhere}
.intro{justify-content:space-between}
.intro-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.go-pill{background:var(--ink);color:var(--paper);font-family:var(--display);font-size:1.4rem;padding:6px 22px;border-radius:999px;margin-top:6px;box-shadow:0 4px 0 rgba(6,10,50,.3)}
.seg button.hard[aria-pressed="true"]{background:var(--tomato);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Lobby (tablet) */
.lobby{flex:1;width:100%;max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;align-items:center;padding-block:16px}
.lobby-qr{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qr{width:min(78vw,340px,40vh);aspect-ratio:1;background:#fff;border-radius:24px;padding:14px;box-shadow:0 0 0 6px var(--paper),0 12px 0 6px rgba(6,10,50,.4);display:grid;place-items:center;color:var(--ink);font-weight:700}
.qr svg{width:100%;height:100%}
.qr.small{width:min(60vw,240px)}
.code{font-weight:700;color:var(--muted)}
.code b{font-family:var(--display);font-weight:400;font-size:2.2rem;letter-spacing:.12em;color:var(--paper);margin-left:6px}
.lobby-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.lobby-side h1{font-family:var(--display);font-size:clamp(2.4rem,7vw,3.6rem);line-height:1;color:var(--paper)}
/* The player list scrolls inside its own box, so the start button above it never moves off screen */
.players{list-style:none;margin:0;padding:2px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;max-height:min(34vh,320px);overflow-y:auto;overscroll-behavior:contain}
.players li{display:flex;align-items:center;gap:8px;background:var(--bg-2);border-radius:12px;padding:8px 10px;box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.players li.empty{grid-column:1/-1}
.players li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem}
.players li span.st{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.players li.ready span.st{color:var(--mint)}
.players li.empty{color:var(--muted);justify-content:center}
.pdot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
.pdot.on{background:var(--mint)}
.btn-team.as-label{cursor:default}
.btn-team.as-label:active{transform:none;box-shadow:0 0 0 5px var(--paper),0 10px 0 5px rgba(6,10,50,.45)}
.intro .btn-team.as-label{margin-bottom:8px}
.disc:not(button){cursor:default}
.who.warn{color:var(--sun)}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px;font-weight:600;font-size:.95rem}
.intro .link-btn{margin-bottom:clamp(16px,6vh,64px)}
.confirm-box{width:100%;max-width:480px;background:var(--bg-2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 2px var(--tomato);text-align:center}
.intro .confirm-box{margin-bottom:clamp(16px,6vh,64px)}
.confirm-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.crown-btn{flex:none;width:30px;height:30px;padding:3px;border:0;background:none;cursor:pointer;opacity:.28;filter:grayscale(1)}
.crown-btn.on{opacity:1;filter:none}
.crown-btn svg{width:100%;height:100%}
/* Admin remote (phone) */
.adm-fab{position:fixed;z-index:70;top:max(10px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:7px 12px 7px 9px;
  font-family:var(--display);font-size:1rem;box-shadow:0 4px 0 rgba(6,10,50,.4);cursor:pointer}
.adm-fab svg{width:22px;height:16px}
.adm-sec{display:flex;flex-direction:column;gap:10px}
.adm-sec h3{margin:6px 0 0}
.sheet .adm-players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.adm-players li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.adm-players li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-players .st{color:var(--muted);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.adm-players .ready .st{color:var(--mint)}
.sheet .adm-players li{flex-direction:column;align-items:stretch;gap:6px}
.sheet .adm-players li.editing{flex-direction:row;align-items:center}
.sheet .adm-players li.editing .field{min-height:44px;font-size:1rem}
.adm-row{display:flex;align-items:center;gap:8px;min-width:0}
.adm-row .adm-team{max-width:none;flex:1}
.adm-ico{flex:none;width:36px;height:36px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.adm-ico svg{width:18px;height:18px}
.adm-ico.on{background:var(--sun);color:var(--ink)}
.lock-btn{flex:none;width:26px;height:26px;border:0;background:none;color:var(--muted);opacity:.45;cursor:pointer;padding:2px}
.lock-btn.on{opacity:1;color:var(--sun)}
.lock-btn svg{width:100%;height:100%}
/* Discreet on purpose: seen after the main button, not tapped by reflex */
.undo-btn{align-self:center;display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;color:#8FA2F0;opacity:.75;
  font:inherit;font-weight:700;font-size:.95rem;padding:10px 12px;margin-top:6px;text-align:left}
.undo-btn svg{width:20px;height:20px;flex:none}
.undo-btn small{font-weight:600;opacity:.8;margin-left:4px}
.undo-btn:active{opacity:1}
.plus-pop{position:fixed;left:50%;top:34%;z-index:80;pointer-events:none;font-family:var(--display);font-size:clamp(3.4rem,16vw,6rem);line-height:1;
  color:var(--team);-webkit-text-stroke:3px var(--paper);paint-order:stroke fill;text-shadow:0 6px 0 rgba(6,10,50,.45);animation:plus 1.5s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes plus{0%{transform:translate(-50%,10px) scale(.4);opacity:0}15%{transform:translate(-50%,0) scale(1.15);opacity:1}30%{transform:translate(-50%,-10px) scale(1)}100%{transform:translate(-50%,-110px) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.plus-pop{animation:plusfade 1.2s forwards}@keyframes plusfade{0%,60%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}}
.adm-team{border:0;border-radius:999px;background:var(--team);color:var(--ink);font-family:var(--display);font-size:.85rem;padding:5px 10px;cursor:pointer;max-width:42%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-kick{border:0;background:none;color:var(--muted);font-weight:800;cursor:pointer;padding:4px 6px;white-space:nowrap}
.adm-kick.arm{color:var(--tomato)}
.adm-scores{display:flex;flex-wrap:wrap;gap:6px}
.adm-scores span{background:rgba(255,255,255,.08);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
.tdot{width:30px;height:30px;border-radius:50%;background:var(--team);border:3px solid var(--paper);padding:0;cursor:pointer;flex:none}
.legend-teams{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:4px}
.legend-teams span{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.legend-teams i{width:14px;height:14px;border-radius:50%;background:var(--team)}
.legend-teams .hint{flex-basis:100%;font-weight:400}
.lobby-side h1{font-size:clamp(1.8rem,3.8vw,2.6rem)!important}
.lobby-side .opt{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px}
.lobby-side .opt>span{min-width:150px;font-size:.95rem}
.lobby-side .seg button{min-height:42px;padding:0 15px}
.lobby-side .legend-teams{flex-basis:100%}
/* Landscape tablet: the lobby fills the screen and only the player list scrolls */
@media (orientation:landscape) and (min-width:720px){
  #app.lobbymode{height:100%;min-height:0}
  .lobbymode .lobby{min-height:0;align-items:stretch;padding-block:0}
  .lobbymode .lobby-qr{justify-content:center}
  .lobbymode .lobby-side{min-height:0;overflow:hidden;gap:12px}
  .lobbymode .players{flex:1 1 auto;min-height:96px;max-height:none}
}
.tchip{border:0;border-radius:999px;background:var(--team);color:var(--ink);font-family:var(--display);font-size:.9rem;padding:5px 10px;cursor:pointer;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis;flex:none}
.shared-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.shared-stage #t-num{font-size:clamp(7rem,min(34vw,32vh),20rem)}
.shared-stage .bar{height:18px;width:min(100%,820px)}
.giver-line{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.6rem);color:var(--paper)}
.giver-line b{font-weight:400;color:var(--team)}
.shared-meta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.shared-meta span{background:var(--bg-2);border-radius:999px;padding:8px 18px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--line);font-size:1.1rem}
.who{color:var(--muted);font-weight:700;font-size:1.1rem}
.who b{color:var(--paper)}
.kick{background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 6px}
.net{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--muted)}
.net i{width:10px;height:10px;border-radius:50%;background:var(--sun)}
.net.on i{background:var(--mint)}
.net.err{color:var(--tomato)}
.net.err i{background:var(--tomato)}

/* Phone */
.phone{flex:1;width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:8px}
.phone-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
.phone h1{font-family:var(--display);font-size:clamp(2.2rem,10vw,3rem);line-height:1.05;color:var(--paper)}
.phone .lead{color:var(--muted);font-size:1.05rem}
.pick-card{width:100%;min-height:120px;border:0;border-radius:22px;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.1;padding:22px;cursor:pointer;box-shadow:0 7px 0 rgba(6,10,50,.4);overflow-wrap:anywhere;transition:transform .06s}
.pick-card:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(6,10,50,.4)}
.pick-card small{display:block;font-family:var(--body);font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.45;margin-bottom:6px}
.or{font-family:var(--display);color:var(--sun);font-size:1.4rem}
.progress{height:10px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun);border-radius:999px}
.team-pick{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tp{border:0;border-radius:16px;min-height:58px;padding:8px 12px;background:var(--team);color:var(--ink);font-family:var(--display);font-size:1.2rem;line-height:1.1;cursor:pointer;
  opacity:.45;box-shadow:0 5px 0 rgba(6,10,50,.35);overflow-wrap:anywhere;transition:opacity .15s,transform .06s}
.tp:active{transform:translateY(3px)}
.tp.on{opacity:1;box-shadow:0 0 0 4px var(--paper),0 8px 0 4px rgba(6,10,50,.35)}
.done-mark{width:110px;height:110px;margin:0 auto;border-radius:50%;background:var(--mint);color:#06281A;display:grid;place-items:center;box-shadow:0 0 0 7px var(--paper),0 10px 0 7px rgba(6,10,50,.35)}
.done-mark svg{width:58%;height:58%}
.mini-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mini-list span{background:var(--bg-2);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem;box-shadow:inset 0 0 0 1px var(--line)}
.chrono{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.chrono .pill{background:var(--team);color:var(--ink);font-family:var(--display);font-size:1.4rem;padding:6px 18px;border-radius:999px}
.chrono .rt{font-family:var(--display);font-size:1.6rem;color:var(--sun)}
#c-num{font-family:var(--display);font-size:clamp(7rem,48vw,16rem);line-height:.9;color:var(--paper);text-shadow:0 8px 0 rgba(6,10,50,.5);font-variant-numeric:tabular-nums}
#c-num small{font-size:.45em;vertical-align:.8em}
.chrono.danger #c-num{color:var(--tomato)}
.chrono .bar{width:100%;height:16px}
.chrono.danger .bar i{background:var(--tomato)}
.chrono .big-msg{font-family:var(--display);font-size:clamp(2.4rem,11vw,3.6rem);line-height:1.05;color:var(--paper)}
.chrono .big-msg.bad{color:var(--tomato)}
/* Phone that holds the cards */
#app.fill.gmode{min-height:0}
.gturn{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;position:relative;
  display:grid;grid-template-rows:auto auto minmax(80px,1fr) auto;gap:clamp(18px,3vh,28px);align-items:center;justify-items:center}
.g-hud{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.g-team{background:var(--team);color:var(--ink);font-family:var(--display);font-size:.85rem;padding:3px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.g-round{font-family:var(--display);font-size:.95rem;color:var(--muted)}
.g-timer{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.gturn #c-num{font-family:var(--display);font-size:clamp(3rem,min(20vw,10vh),6rem);line-height:.9;color:var(--sun);text-shadow:0 5px 0 rgba(6,10,50,.5);font-variant-numeric:tabular-nums}
.gturn #c-num small{font-size:.5em;vertical-align:.7em}
.gturn .bar{width:100%;height:10px;margin:0}
.gturn.danger #c-num{color:var(--tomato)}
.gturn.danger .bar i{background:var(--tomato)}
.g-card{width:100%;height:100%;min-height:80px;max-height:300px;padding:20px}
.g-card .word{font-size:clamp(1.8rem,min(9vw,6vh),3.4rem)}
.g-card .badge{min-width:42px;height:42px;font-size:1.2rem;right:-8px;bottom:-8px}
.g-btns{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,20px);padding-bottom:10px}
.gturn .ok{width:clamp(92px,min(46vw,20vh),210px);box-shadow:0 0 0 5px var(--paper),0 8px 0 5px rgba(6,10,50,.35)}
.gturn .no{width:clamp(58px,min(19vw,9vh),96px);margin-top:0;box-shadow:0 0 0 4px var(--paper),0 6px 0 4px rgba(6,10,50,.35)}
.giver-turn #c-num{font-family:var(--display);font-size:clamp(4rem,min(22vw,12vh),7rem);line-height:.9;color:var(--sun);text-shadow:0 6px 0 rgba(6,10,50,.5);font-variant-numeric:tabular-nums}
.giver-turn #c-num small{font-size:.5em;vertical-align:.7em}
.giver-turn .danger #c-num{color:var(--tomato)}
.giver-turn .danger .bar i{background:var(--tomato)}
.chrono .left{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.play-ico{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.play-ico svg{width:20px;height:20px;margin-left:3px}
.icon-btn{background:rgba(255,255,255,.1);border:0;border-radius:12px;min-height:44px;min-width:44px;padding:0 14px;font-weight:700;cursor:pointer;color:var(--fg)}

/* Setup */
.setup{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-bottom:24px}
.hero{display:flex;flex-direction:column;gap:12px;padding-top:8px;align-items:flex-start}
.logo{position:relative;display:inline-block}
.logo-main{font-family:var(--display);font-size:clamp(3.2rem,12vw,5.6rem);line-height:.95;color:var(--paper);text-shadow:0 6px 0 rgba(6,10,50,.45)}
.stamp{position:absolute;right:-14px;bottom:-12px;transform:rotate(-7deg);background:var(--sun);color:var(--ink);font-family:var(--display);font-size:1.15rem;padding:4px 12px;border-radius:8px;box-shadow:0 3px 0 rgba(6,10,50,.4)}
.tagline{color:var(--muted);max-width:52ch;font-size:1.05rem;margin-top:10px}
.panel{background:var(--bg-2);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--line)}
.panel h2{font-family:var(--body);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.teams{display:flex;flex-direction:column;gap:10px}
.team-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.dot{width:40px;height:40px;border-radius:50%;background:var(--team);border:3px solid var(--paper);cursor:pointer;padding:0}
.field{width:100%;min-width:0;background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;color:var(--fg);font:inherit;font-size:1.1rem;min-height:52px;padding:0 14px}
.field:focus{border-color:var(--sun);outline:none}
textarea.field{min-height:130px;padding:12px 14px;resize:vertical;line-height:1.5}
.field::placeholder{color:rgba(243,245,255,.4)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt>span,.sub{font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:48px;padding:0 18px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid transparent;font-weight:700;cursor:pointer;color:var(--fg)}
.seg button small{opacity:.65;font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--ink)}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600;cursor:pointer}
.check input{width:26px;height:26px;accent-color:var(--sun);flex:none;margin:0}
.avail{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.err{background:var(--tomato);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700}
.start{min-height:76px;font-size:1.8rem;width:100%}
.setup .topbar .t-label{flex:1;text-align:center}
/* Welcome */
.home{flex:1;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:clamp(14px,3vh,36px);text-align:center;padding-block:clamp(8px,3vh,40px)}
.home-main{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px)}
.stamp-inline{display:inline-block;transform:rotate(-7deg);background:var(--sun);color:var(--ink);font-size:.55em;padding:2px 10px;border-radius:8px;vertical-align:middle;box-shadow:0 3px 0 rgba(6,10,50,.4)}
.home .tagline{margin-top:0;font-size:clamp(1rem,2.8vw,1.2rem);max-width:30ch}

/* Hero: the cards sit behind the logo; their lower part fades out (mask) so the logo reads cleanly over them. */
.home-hero{--cw:clamp(86px,23vw,132px);--ch:calc(var(--cw)*1.25);position:relative;display:flex;flex-direction:column;align-items:center}
.hero-cards{position:relative;z-index:0;display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,2vw,14px);
  height:calc(var(--ch) + 30px);padding:0 30px;margin:0 -30px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 54%,transparent 80%);mask-image:linear-gradient(to bottom,#000 0,#000 54%,transparent 80%)}
.hc{position:relative;flex:none;width:var(--cw);height:var(--ch);background:var(--paper);color:var(--ink);border-radius:16px;
  box-shadow:0 6px 0 rgba(6,10,50,.35);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(5px,1.2vw,9px);padding:calc(var(--ch)*.19) 6px 0;
  transform:translateY(var(--y)) rotate(var(--r));transform-origin:50% 100%}
.hc::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(20,26,58,.14);border-radius:11px;pointer-events:none}
.hc i{position:absolute;left:-6px;top:-8px;font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--ink);border:3px solid var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:.95rem;box-shadow:0 3px 0 rgba(6,10,50,.3)}
.hc b{font-family:var(--display);font-weight:400;font-size:clamp(.82rem,2.4vw,1.08rem);line-height:1.05}
.hc svg{width:38%;height:auto;color:var(--ink)}
.hc1{--r:-8deg;--y:8px;--c:var(--sun)}
.hc2{--r:0deg;--y:-6px;--c:var(--mint)}
.hc3{--r:8deg;--y:8px;--c:var(--tomato)}
.hc3 i{color:#fff}
.home-logo{position:relative;z-index:1;margin:calc(var(--ch)*-.34) 0 0;font-weight:400}
.home-logo .logo-main{display:block;font-size:clamp(3.8rem,15vw,7.5rem)}
.home-logo .stamp{right:clamp(-20px,-1.8vw,-12px);bottom:clamp(-20px,-1.8vw,-12px);font-size:clamp(1.1rem,2.6vw,1.6rem);padding:4px 14px}

/* Arrival animation: cards rise from behind the logo one after the other, then the stamp lands. */
.home.intro .hc{animation:hcRise .7s cubic-bezier(.2,.9,.3,1.12) both;animation-delay:var(--d)}
.home.intro .hc1{--d:.08s} .home.intro .hc2{--d:.2s} .home.intro .hc3{--d:.32s}
@keyframes hcRise{from{transform:translateY(calc(var(--ch) + 30px)) rotate(0deg)}to{transform:translateY(var(--y)) rotate(var(--r))}}
.home.intro .logo-main{animation:logoIn .45s ease-out both,logoThump .28s ease-out 1.38s}
@keyframes logoIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes logoThump{40%{transform:scale(.97) translateY(2px)}}
.home.intro .home-logo .stamp{animation:stampLand .5s cubic-bezier(.3,1.35,.5,1) 1.05s both}
@keyframes stampLand{0%{opacity:0;transform:translateY(-110px) rotate(-28deg) scale(1.9)}60%{opacity:1;transform:translateY(5px) rotate(-5deg) scale(.9)}100%{opacity:1;transform:rotate(-7deg)}}
.home.intro .tagline,.home.intro .home-actions{animation:softIn .5s ease-out .25s both}
@keyframes softIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.home.intro .hc,.home.intro .logo-main,.home.intro .home-logo .stamp,.home.intro .tagline,.home.intro .home-actions{animation:none}}

.home-actions{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:6px}
.disc-wrap.home-disc{width:min(62vw,32vh,360px);margin-bottom:clamp(14px,3vh,30px)}
.home-disc .disc{width:78%;padding:10px}
.home-disc .disc strong{font-size:clamp(2.2rem,min(9vw,5.6vh),3.6rem)}
@media (orientation:landscape) and (min-width:900px){
  .home{flex-direction:row;max-width:1120px;justify-content:center;gap:clamp(32px,6vw,90px)}
  .home-main{flex:0 1 560px}
  .home-actions{flex:0 0 340px}
  .disc-wrap.home-disc{width:min(100%,46vh,340px)}
}
/* Card source choice */
.src-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.src{border:2px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;font:inherit}
.src-ico{flex:none;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:var(--fg)}
.src-ico svg{width:30px;height:30px}
.src.on .src-ico{background:var(--sun);color:var(--ink)}
.src-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.src b{font-weight:800;font-size:1.05rem}
.src-txt span{color:var(--muted);font-size:.92rem;line-height:1.35}
.src.on{border-color:var(--sun);background:rgba(255,201,60,.12);box-shadow:inset 0 0 0 1px var(--sun)}
/* Folded settings */
.fold{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;color:var(--fg);cursor:pointer;padding:0;text-align:left;font:inherit}
.fold span{display:flex;flex-direction:column;gap:2px;min-width:0}
.fold b{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.fold small{font-size:1rem;font-weight:700;color:var(--fg)}
.fold i{font-style:normal;flex:none;background:rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.fold-body{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:16px}

/* Shared */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.t-label{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem}
.center-col{flex:1;width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px;padding-block:16px}
.titles{display:flex;flex-direction:column;align-items:center;gap:10px}
.mega{font-family:var(--display);font-size:clamp(3.2rem,13vw,6rem);line-height:1;color:var(--paper);text-shadow:0 6px 0 rgba(6,10,50,.45)}
.mega-sub{font-family:var(--display);font-size:clamp(1.8rem,7vw,3rem);line-height:1.1;color:var(--sun);text-shadow:0 4px 0 rgba(6,10,50,.45)}
.round-rules{font-size:clamp(1.02rem,3vw,1.2rem);max-width:36ch;line-height:1.55;color:var(--muted);opacity:.85}
.round-rules b{color:inherit;font-weight:800}
.meta-line{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}

/* Ready: a cartoon "go" disc in the team colour over a slow sunburst */
.rg-a,.rg-b{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;min-width:0}
/* Landscape tablet: disc on the left, who-plays and live scores on the right, so everything fits without scrolling */
@media (orientation:landscape) and (min-width:900px){
  .ready-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:32px;max-width:1100px}
  .ready-grid .disc-wrap{width:min(40vw,52vh,400px)}
  .ready-grid .mega{font-size:clamp(2.6rem,6vw,4.4rem)}
}
.live-scores{width:100%;max-width:680px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding-top:22px}
.ls{position:relative;flex:1 1 130px;max-width:210px;min-width:0;background:var(--paper);color:var(--ink);border-radius:18px;border-top:8px solid var(--team);
  padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(6,10,50,.4);transition:transform .2s}
.ls.is-lead{transform:translateY(-4px);box-shadow:0 0 0 4px var(--team),0 9px 0 4px rgba(6,10,50,.4)}
.ls-name{font-weight:800;font-size:.9rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-total{font-family:var(--display);font-size:clamp(2rem,6vw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.ls-crown{position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(-6deg);width:42px;filter:drop-shadow(0 3px 0 rgba(6,10,50,.4))}
.ls-crown svg{width:100%;height:auto}
.ls-delta{position:absolute;top:-12px;right:-10px;background:var(--mint);color:#06281A;font-family:var(--display);font-size:1.15rem;padding:3px 10px;border-radius:999px;box-shadow:0 3px 0 rgba(6,10,50,.35);animation:popin .55s cubic-bezier(.2,1.6,.4,1)}
.ls-delta.zero{background:var(--bg-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
@keyframes popin{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.ls-delta{animation:none}}
.disc-wrap{position:relative;width:min(86vw,44vh,400px);max-width:100%;aspect-ratio:1;display:grid;place-items:center}
.disc-wrap::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.13) 0 9deg,transparent 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 45%,transparent 70%);mask:radial-gradient(circle,#000 45%,transparent 70%);
  animation:spin 40s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.disc{
  position:relative;width:76%;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.45),transparent 48%),var(--team);color:var(--ink);
  box-shadow:0 0 0 8px var(--paper),0 0 0 14px rgba(6,10,50,.35),0 16px 0 14px rgba(6,10,50,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;
  animation:bob 1.6s ease-in-out infinite alternate;transition:transform .08s ease;
}
.disc::after{content:"";position:absolute;inset:14px;border-radius:50%;border:3px dashed rgba(20,26,58,.22);pointer-events:none}
@keyframes bob{from{transform:scale(1)}to{transform:scale(1.035)}}
.disc:active{animation:none;transform:scale(.95)}
.disc small{font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:.85rem;opacity:.7}
.disc strong{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7.5vw,3.2rem);line-height:1;text-wrap:balance;overflow-wrap:anywhere;color:var(--ink)}
.disc .play-ico{width:58px;height:58px;margin-top:6px;box-shadow:0 4px 0 rgba(6,10,50,.3)}
.disc .play-ico svg{width:24px;height:24px}

/* Turn */
.play{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;position:relative}
.hud{display:flex;align-items:center;gap:10px}
.hud .pill{background:var(--team);color:var(--ink);font-family:var(--display);font-size:1.05rem;padding:5px 14px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud .hud-mid{flex:1;text-align:center;font-family:var(--display);font-size:1.2rem;color:var(--paper);white-space:nowrap}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px;min-height:0}
.stage-a,.stage-b{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#t-num{font-family:var(--display);font-size:clamp(5rem,min(26vw,15vh),11rem);line-height:.9;color:var(--sun);text-shadow:0 6px 0 rgba(6,10,50,.5);font-variant-numeric:tabular-nums}
#t-num small{font-size:.5em;vertical-align:.7em;margin-left:2px}
.timer.danger #t-num{color:var(--tomato);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.bar{width:min(100%,640px);height:10px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:100%;background:var(--sun);border-radius:999px;transition:width .1s linear}
.timer.danger .bar i{background:var(--tomato)}
.timer{display:flex;flex-direction:column;align-items:center;width:100%;margin-bottom:18px}
.card{
  width:min(100%,640px);min-height:clamp(120px,20vh,240px);position:relative;
  background:var(--paper);color:var(--ink);border-radius:24px;box-shadow:0 10px 0 rgba(6,10,50,.45);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 26px;transform:rotate(-1.2deg);
}
.card::before{content:"";position:absolute;inset:10px;border:2px dashed rgba(20,26,58,.16);border-radius:16px;pointer-events:none}
.card.enter{animation:deal .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes deal{from{transform:translateY(16px) rotate(-4deg);opacity:.2}to{transform:rotate(-1.2deg);opacity:1}}
.card.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:rotate(-1.2deg)}25%{transform:translateX(-10px) rotate(-1.2deg)}75%{transform:translateX(10px) rotate(-1.2deg)}}
.word{font-family:var(--display);font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;min-width:0}
.badge{position:absolute;right:-10px;bottom:-14px;min-width:52px;height:52px;padding:0 6px;border-radius:999px;background:var(--sun);color:var(--ink);border:4px solid var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 rgba(6,10,50,.35)}
.round-btn{border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;user-select:none;-webkit-user-select:none;transition:transform .06s ease,box-shadow .06s ease}
.round-btn:active{transform:translateY(4px)}
.ok{width:clamp(130px,min(50vw,25vh),280px);aspect-ratio:1;background:var(--mint);color:#06281A;box-shadow:0 0 0 7px var(--paper),0 0 0 12px rgba(6,10,50,.25),0 10px 0 12px rgba(6,10,50,.35)}
.ok svg{width:56%;height:56%}
.no{width:clamp(72px,min(23vw,11vh),120px);aspect-ratio:1;background:var(--tomato);color:#fff;box-shadow:0 0 0 5px var(--paper),0 6px 0 5px rgba(6,10,50,.35);margin-top:14px}
.no svg{width:50%;height:50%}
@media (min-width:720px) and (orientation:landscape){
  .stage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr);align-items:center;justify-items:center}
  .ok{width:clamp(150px,36vh,300px)}
  .no{width:clamp(80px,16vh,130px)}
}
.pause-layer{position:absolute;inset:0;background:var(--bg);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;z-index:5;padding:20px}
.pause-layer h2{font-family:var(--display);font-size:3.4rem;color:var(--paper)}
.hint{color:var(--muted);font-size:.95rem}

/* Turn recap */
.recap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
.tr{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
  background:var(--paper);color:var(--ink);border:3px solid transparent;border-radius:16px;padding:12px 16px;cursor:pointer;
  font-family:var(--display);font-size:1.4rem;box-shadow:0 4px 0 rgba(6,10,50,.35)
}
.tr span{min-width:0;overflow-wrap:anywhere}
.tr i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.tr i svg{width:20px;height:20px}
.tr.is-ok i{background:var(--mint);color:#06281A}
.tr.is-no{border-color:var(--tomato);color:#B42A1B}
.tr.is-no i{background:var(--tomato);color:#fff}
.tr.is-last{background:rgba(255,251,240,.35);color:rgba(20,26,58,.65);box-shadow:none;border:3px dashed rgba(255,251,240,.6)}
.tr.is-last i{background:rgba(20,26,58,.12);color:rgba(20,26,58,.5)}
.recap-head{font-weight:800;font-size:1.15rem}
.recap-head b{color:var(--mint)}

/* Scoreboard cards, after the real game's team cards */
.board{width:100%;max-width:640px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:end;padding-top:46px}
.sc{position:relative;background:var(--paper);color:var(--ink);border-radius:22px;box-shadow:0 8px 0 rgba(6,10,50,.4);display:flex;flex-direction:column;transition:transform .2s}
.sc.lead{transform:translateY(-10px);box-shadow:0 0 0 5px var(--team),0 12px 0 5px rgba(6,10,50,.4)}
.sc-name{font-family:var(--display);font-size:clamp(1.3rem,4.5vw,1.8rem);line-height:1.05;color:var(--ink);padding:20px 16px 12px;overflow-wrap:anywhere;text-align:center}
.sc-name::before{content:"";display:block;width:30px;height:6px;border-radius:3px;background:var(--team);margin:0 auto 10px}
.sc-rows{display:flex;flex-direction:column;padding:0 12px}
.sc-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-weight:700;font-variant-numeric:tabular-nums}
.sc-row:nth-child(odd){background:color-mix(in srgb,var(--team) 30%,var(--paper))}
.rn{display:inline-flex;align-items:center;gap:8px;font-size:.9rem}
.rn i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:.95rem}
.sc-row b{font-family:var(--display);font-weight:400;font-size:1.45rem}
.sc-row .dim{opacity:.3}
.sc-total{background:var(--team);color:var(--ink);font-family:var(--display);font-size:clamp(2.4rem,8vw,3.2rem);line-height:1;padding:12px 0 10px;font-variant-numeric:tabular-nums;margin-top:12px;border-radius:0 0 22px 22px;text-align:center}
.crown{position:absolute;top:-44px;left:50%;transform:translateX(-50%) rotate(-6deg);width:66px;filter:drop-shadow(0 4px 0 rgba(6,10,50,.4))}
.crown svg{width:100%;height:auto}
.end-actions{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(9,14,58,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;

    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}

/* ---------- deck ---------- */
function poolFor(s){const p=[];s.cats.forEach(c=>(WORDS[c]||[]).forEach(w=>p.push({w,c:CATS[c]})));return p}
function buildDeck(s){
  const custom=parseCustom(s.custom).map(w=>({w,c:"Perso"}));
  let cards=shuffle(custom).slice(0,s.cardCount);
  if(!s.customOnly){
    const taken=new Set(cards.map(c=>c.w.toLowerCase()));
    let used=new Set(store.get(USED)||[]);
    const pool=poolFor(s).filter(x=>!taken.has(x.w.toLowerCase()));
    const need=s.cardCount-cards.length;
    let fresh=pool.filter(x=>!used.has(x.w));
    if(fresh.length<need){
      const inPool=new Set(pool.map(p=>p.w));
      used=new Set([...used].filter(w=>!inPool.has(w)));
      fresh=pool;
    }
    const picked=shuffle(fresh).slice(0,need);
    picked.forEach(c=>used.add(c.w));
    store.set(USED,[...used]);
    cards=cards.concat(picked);
  }
  return shuffle(cards);
}
function availText(){
  const s=state.settings,c=parseCustom(s.custom).length;
  if(s.customOnly)return c?`${plural(c,"mot perso")} → partie de ${Math.min(c,s.cardCount)} cartes`:"Ajoute tes mots ci-dessus (un par ligne).";
  const p=poolFor(s).length;
  return `${p} mots dans le paquet${c?` + ${c} perso`:""} → partie de ${Math.min(p+c,s.cardCount)} cartes`;
}

/* ---------- duo mode (ranked): 2 players, 4 rounds ----------
   Rounds 1 and 2 (describe, each player once): 60 s + 3 s per card found, up to 20 cards, passing is free.
   After each round, a recap lets the players fix any card before validating.
   All cards found make the deck of rounds 3 (one word) and 4 (mime): 60 s flat, one try per card.
   Score = cards found over the 4 rounds; tie-break = seconds left when a deck is finished early. */
const DUO_START=60000,DUO_BONUS=3000,DUO_MAX=20,LB_KEY="tu-duo-ranked-v3";
const DUO_KIND=[0,0,1,2],DUO_LABELS=["Décrire 1","Décrire 2","Un mot","Mime"];
function duoDescribe(d){return DUO_KIND[d.round-1]===0}
function lbRaw(){const v=store.get(LB_KEY);return Array.isArray(v)?v:[]}
// Same two people (any order, any case/accents) = same duo.
function duoKey(a,b){const n=x=>String(x||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");return [n(a),n(b)].sort().join("&")}
function lbBetter(x,y){return x.score-y.score||(x.spare||0)-(y.spare||0)||y.ts-x.ts}
function lbClean(list){
  const best={};
  (list||[]).forEach(e=>{const k=duoKey(e.a,e.b);if(!best[k]||lbBetter(e,best[k])>0)best[k]=e});
  return Object.values(best).sort((x,y)=>lbBetter(y,x));
}
function lbFor(){return lbClean(lbRaw())}
// Returns {prev, improved, ts}: ts = the duo's entry to highlight.
function lbAdd(e){
  const list=lbClean(lbRaw()),key=duoKey(e.a,e.b),old=list.find(x=>duoKey(x.a,x.b)===key);
  const res={prev:old?old.score:0,improved:!old||lbBetter(e,old)>0,ts:old?old.ts:e.ts};
  if(res.improved){res.ts=e.ts;res.old=old||null;store.set(LB_KEY,list.filter(x=>x!==old).concat(e).sort((x,y)=>lbBetter(y,x)).slice(0,50))}
  return res;
}
function duoNames(){const s=state.settings;return {a:(s.duoA||"").trim()||"Joueur 1",b:(s.duoB||"").trim()||"Joueur 2"}}
function duoDeck(){
  const s=state.settings,used=new Set(store.get(USED)||[]);
  const pool=poolFor(s).concat(parseCustom(s.custom).map(w=>({w,c:"Perso"})));
  // Fresh words first, already-played ones after.
  return shuffle(pool.filter(x=>!used.has(x.w))).concat(shuffle(pool.filter(x=>used.has(x.w))));
}
function duoGiver(d){return d.round%2?d.a:d.b}
function duoGuesser(d){return d.round%2?d.b:d.a}
function lbList(hiTs){
  const list=lbFor().slice(0,10);
  if(!list.length)return `<p class="hint lb-empty">Pas encore de score. À vous d'ouvrir le classement !</p>`;
  return `<ol class="lb">${list.map((e,i)=>`<li class="${i<3?"p"+(i+1):""} ${e.ts===hiTs?"me":""}"><span class="lb-rank">${i===0?ICON.crown:i+1}</span><span class="lb-who"><b>${esc(e.a)} &amp; ${esc(e.b)}</b><small>${e.parts?e.parts.join(" · "):""}${e.ts===hiTs?`<i class="you">vous</i>`:""}</small></span><span class="lb-score">${e.score}</span></li>`).join("")}</ol>`;
}

}
function duoMarkUsed(){
  const d=state.duo;if(!duoDescribe(d)||!d.deck[d.pos])return;

}
function duoGo(){const d=state.duo;d.undo=null;d.left=DUO_START;d.endsAt=Date.now()+d.left;d.paused=false;state.screen="duoTurn";lastSec=null;duoMarkUsed();sfx.go();wake();render()}
function duoTimePop(txt,good){
  const t=document.getElementById("timer");if(!t)return;
  const el=document.createElement("span");el.className="time-pop "+(good?"good":"bad");el.textContent=txt;
  t.appendChild(el);setTimeout(()=>el.remove(),1100);
}
function duoNext(found){
  const d=state.duo;if(!d||d.paused||state.screen!=="duoTurn")return;
  const card=d.deck[d.pos];if(!card)return;

  d.plays.push({w:card.w,c:card.c,ok:found});
  if(found){d.parts[d.round-1]++;sfx.found();if(desc)d.endsAt+=DUO_BONUS}else sfx.pass();
  d.pos++;
  d.left=Math.max(0,d.endsAt-Date.now());
  if(d.pos>=d.deck.length||(desc&&d.parts[d.round-1]>=DUO_MAX)){d.spare+=d.left;duoRoundEnd(true);return}
  if(d.left<=0){duoRoundEnd(false);return}
  duoMarkUsed();ui.shake=!found;render();
  if(found&&desc)duoTimePop("+3 s",true);
}

  }
  state.screen="duoRecap";window.scrollTo(0,0);render();
}

function duoValidate(){

  if(d.round===4||(d.round===2&&!d.found.length)||(d.round===1&&d.pos>=d.deck.length)){duoFinish();return}

const net={peer:null,conns:new Map(),status:"off",err:"",retries:0,reopening:false};
/* Only one tablet tab per device may hold the room: when a new tab opens the game, older tabs step aside.
   Otherwise two tabs fight over the same room code and phones end up connected to a hidden tab. */
const TAB_ID=Math.random().toString(36).slice(2);
let hostBC=null;
function claimHost(){
  try{
    if(!hostBC){
      hostBC=new BroadcastChannel("tu-maison-host");
      hostBC.onmessage=e=>{const d=e.data||{};if(d.t==="claim"&&d.id!==TAB_ID&&!yielded)yieldHost()};
    }
    hostBC.postMessage({t:"claim",id:TAB_ID});

}
function yieldHost(){
  yielded=true;
  try{net.peer&&net.peer.destroy()}catch(e){}
  net.peer=null;net.conns.clear();
  app.className="scroll";
  app.innerHTML=`<div class="center-col"><h1 class="mega" style="font-size:clamp(2rem,6vw,3rem)">Le jeu est ouvert dans un autre onglet</h1>
    <p class="round-rules">Cet onglet s'est mis en veille pour que les téléphones restent connectés au bon endroit.</p>
    <button class="btn btn-sun" data-act="reclaim">Utiliser plutôt cet onglet</button></div>`;
}
async function hostStart(){
  if(!ONLINE||ROLE!=="host"||yielded)return;
  if(!state.code){state.code=makeCode();save()}
  state.online=true;

  if(net.peer)return;
  net.status="connecting";
  try{await loadScript(LIBS.peer)}catch(e){net.status="error";net.err="Module de connexion introuvable. Vérifie internet.";rerenderNet();return}

function reopenHost(delay){
  if(net.reopening)return;net.reopening=true;
  try{net.peer&&net.peer.destroy()}catch(e){}
  net.peer=null;net.conns.clear();
  setTimeout(()=>{net.reopening=false;openHostPeer()},delay);
}
// A fresh room code (the old one is stuck on the connection server). Phones must scan the new QR code.
function newRoomCode(){

function openHostPeer(){
  if(net.peer||!window.Peer||yielded)return;
  const peer=new Peer(PEER_PREFIX+state.code,{debug:0});
  net.peer=peer;
  peer.on("open",()=>{net.status="on";net.retries=0;rerenderNet()});
  peer.on("connection",conn=>{
    conn.on("open",()=>{net.conns.set(conn.peer,{conn,pid:null});sendTo(conn,hostConfig());sendTo(conn,tickMsg());rerenderNet()});
    conn.on("data",d=>onHostData(conn,d));
    conn.on("close",()=>{
      const c=net.conns.get(conn.peer);
      if(c&&c.pid&&state.lobby&&state.lobby.players[c.pid])state.lobby.players[c.pid].online=false;
      net.conns.delete(conn.peer);
      // The phone holding the cards dropped: stop the chrono and let the tablet decide (wait for it, or play on the tablet).
      const t=state.turn;
      if(c&&state.screen==="turn"&&t&&t.onPhone&&t.giver===c.pid&&!pidOnline(c.pid)){pauseTurn();render();return}
      rerenderNet();
    });
    conn.on("error",()=>{});
  });
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable")return;
    // Code still held by an old session: retry a few times (it frees up after a reload), then switch to a new code.
    if(e.type==="unavailable-id"){
      net.retries++;net.status="connecting";
      if(net.retries<=4)reopenHost(3000);else newRoomCode();
      return;
    }

}

const ADMIN_ACTS={lobby:["per","customs","giverMode","pteam","kick","lobbyStart","rename","lock"],roundIntro:["goTablet","go"],ready:["goTablet","go","undoTurn"],

  const t=state.turn;let pts=0;ui.confirmTablet=false;
  // Snapshot so a too-quick "Valider" can be undone until the next turn starts.
  state.undo=JSON.parse(JSON.stringify({pile:state.pile,scores:state.scores,lastTurn:state.lastTurn||null,giverIdx:state.giverIdx||null,teamIdx:state.teamIdx,turn:t}));
  t.rows.forEach(r=>{
    if(r.ok){state.pile=state.pile.filter(x=>x!==r.i);pts++}
    else if(!state.pile.includes(r.i))state.pile.push(r.i);
  });
  state.scores[state.teamIdx][state.round-1]+=pts;
  state.lastTurn={team:state.teamIdx,pts};
  if(state.giverIdx&&(state.teams[state.teamIdx].players||[]).length)state.giverIdx[state.teamIdx]=(state.giverIdx[state.teamIdx]||0)+1;
  state.pile=shuffle(state.pile);
  state.teamIdx=(state.teamIdx+1)%state.teams.length;
  state.turn=null;
  state.screen=state.pile.length?"ready":"roundEnd";
  window.scrollTo(0,0);render();
}
/* Back to the recap of the turn just validated (only until the next turn or round starts) */
function undoTurn(){
  const u=state.undo;if(!u||!(state.screen==="ready"||state.screen==="roundEnd"))return;
  Object.assign(state,{pile:u.pile,scores:u.scores,lastTurn:u.lastTurn,giverIdx:u.giverIdx,teamIdx:u.teamIdx,turn:u.turn,undo:null,screen:"turnEnd"});
  ui.confirmTablet=false;window.scrollTo(0,0);render();
}
function undoLink(){
  const u=state.undo;if(!u||!state.teams[u.teamIdx])return "";
  const pts=u.turn.rows.filter(r=>r.ok).length;
  return `<button class="undo-btn" data-act="undoTurn">${ICON.undo}<span>Corriger le tour précédent <small>${esc(state.teams[u.teamIdx].name)} · +${pts}</small></span></button>`;
}
function resetGame(){
  state={screen:"setup",settings:state.settings,code:state.code,online:state.online,admin:state.admin};
  ui={menu:false,rules:false,confirmQuit:false,err:"",shake:false,phones:false};
  render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el)return;
  if(e.target.closest("[data-stop]")&&el.matches(".overlay"))return;
  hostAct(el.dataset.act,el);
});
/* Every tablet action, callable from a tap on the tablet or from the admin's phone */
function hostAct(act,el){
  const s=state.settings;
  switch(act){
    case "reclaim":location.reload();break;
    case "newCode":newRoomCode();break;
    case "setAdmin":{const pid=el.dataset.pid;state.admin=state.admin===pid?null:pid;render();break}
    case "rules":ui.rules=true;ui.menu=false;render();break;
    case "closeRules":ui.rules=false;render();break;
    case "menu":if(state.screen==="turn")pauseTurn();ui.menu=true;ui.confirmQuit=false;render();break;
    case "closeMenu":ui.menu=false;ui.confirmQuit=false;render();break;
    case "sound":s.sound=!s.sound;render();if(s.sound)sfx.found();break;
    case "quit":if(!ui.confirmQuit){ui.confirmQuit=true;render()}else resetGame();break;
    case "addTeam":{
      const usedC=s.teams.map(t=>t.color),d=TEAM_DEFS.find(x=>!usedC.includes(x[1]))||TEAM_DEFS[0];
      s.teams.push({name:d[0],color:d[1]});
      render();break;
    }
    case "delTeam":s.teams.splice(+el.dataset.i,1);render();break;
    case "color":{
      const i=+el.dataset.i,usedC=s.teams.filter((_,j)=>j!==i).map(t=>t.color);
      let k=COLORS.indexOf(s.teams[i].color);
      for(let n=0;n<COLORS.length;n++){k=(k+1)%COLORS.length;if(!usedC.includes(COLORS[k]))break}
      // A default name follows the colour ("Équipe rouge" → "Équipe jaune"); a custom name is kept.
      if(isAutoName(s.teams[i].name))s.teams[i].name=colorName(COLORS[k]);
      s.teams[i].color=COLORS[k];render();break;
    }
    case "toSetup":state.screen="setup";window.scrollTo(0,0);render();break;
    case "toHome":state.screen="home";ui.err="";window.scrollTo(0,0);render();break;
    case "toDuo":case "duoBack":state.screen="duoSetup";ui.err="";ui.confirmClear=false;ui.settingsOpen=false;window.scrollTo(0,0);render();break;
    case "duoSwap":{const a=s.duoA;s.duoA=s.duoB;s.duoB=a;render();break}
    case "duoStart":duoStart();break;
    case "duoGo":duoGo();break;
    case "duoFound":duoNext(true);break;
    case "duoPass":duoNext(false);break;
    case "duoPause":{const d=state.duo;if(d&&!d.paused){d.left=Math.max(0,d.endsAt-Date.now());d.paused=true;ui.confirmQuit=false;render()}break}
    case "duoResume":{const d=state.duo;if(d){d.paused=false;d.endsAt=Date.now()+d.left;lastSec=null;render()}break}
    case "duoToggle":{const r=state.duo&&state.duo.plays[+el.dataset.i];if(r){r.ok=!r.ok;render()}break}
    case "duoValidate":duoValidate();break;
    case "duoUndo":duoUndo();break;
    case "duoHelp":ui.duoHelp=!ui.duoHelp;render();break;
    case "duoQuitAsk":ui.confirmQuit=true;render();break;
    case "duoQuitCancel":ui.confirmQuit=false;render();break;
    case "duoQuit":ui.confirmQuit=false;state.duo=null;state.screen="duoSetup";render();break;
    case "lbClearAsk":ui.confirmClear=true;render();break;
    case "lbClearCancel":ui.confirmClear=false;render();break;
    case "lbClear":store.set(LB_KEY,[]);ui.confirmClear=false;render();break;
    case "src":s.phones=el.dataset.v==="phones";render();break;
    case "toggleSettings":ui.settingsOpen=!ui.settingsOpen;render();break;
    case "toggleCustom":ui.customOpen=!ui.customOpen;render();break;
    case "cards":s.cardCount=+el.dataset.v;render();break;
    case "dur":s.duration=+el.dataset.v;render();break;
    case "cat":{const k=el.dataset.k;s.cats=s.cats.includes(k)?s.cats.filter(x=>x!==k):s.cats.concat(k);render();break}
    case "start":startGame();break;
    case "per":state.lobby.per=s.lobbyPer=+el.dataset.v;render();broadcast(hostConfig());break;
    case "customs":state.lobby.customs=s.lobbyCustoms=+el.dataset.v;render();broadcast(hostConfig());break;
    case "kick":delete state.lobby.players[el.dataset.pid];render();broadcast(hostConfig());break;
    case "lobbyBack":state.screen="setup";render();break;
    case "lobbyStart":{const d=lobbyDeck();if(d.length>=5)startGame(shuffle(d));break}
    case "phones":ui.menu=false;ui.phones=true;hostStart();render();break;
    case "closePhones":ui.phones=false;render();break;
    case "go":if(!giverOf())startTurn();break;
    case "found":doFound();break;
    case "pass":doPass();break;
    case "askTablet":ui.confirmTablet=true;render();break;
    case "cancelTablet":ui.confirmTablet=false;render();break;
    case "goTablet":if(state.screen==="ready"||state.screen==="roundIntro")startTurn(true);break;
    case "takeoverTablet":if(state.turn){state.turn.onPhone=false;ui.confirmTablet=false;render()}break;
    case "giverMode":state.lobby.giverPhones=s.lobbyGiverPhones=el.dataset.v==="1";render();broadcastTick();break;
    case "pteam":{const p=state.lobby.players[el.dataset.pid];if(p){p.team=((p.team||0)+1)%lobbyTeams().length;render();broadcastTick()}break}
    case "lock":{const p=state.lobby&&state.lobby.players[el.dataset.pid];if(p){p.locked=!p.locked;render();broadcastTick()}break}
    case "pause":pauseTurn();render();break;
    case "resume":resumeTurn();render();break;
    case "toggleRow":{const r=state.turn&&state.turn.rows[+el.dataset.i];if(r){r.ok=!r.ok;render()}break}
    case "confirmTurn":confirmTurn();break;
    case "undoTurn":undoTurn();break;
    case "recapTablet":if(state.turn){state.turn.onPhone=false;ui.confirmTablet=false;render()}break;
    case "nextRound":
      ui.confirmTablet=false;state.undo=null;
      if(state.round>=3){state.screen="gameEnd";render();break}
      state.round++;state.pile=shuffle(state.deck.map((_,i)=>i));state.screen="roundIntro";window.scrollTo(0,0);render();break;
    case "rematch":
      state.lastTurn=null;state.undo=null;
      state.round=1;state.scores=state.teams.map(()=>[0,0,0]);state.pile=shuffle(state.deck.map((_,i)=>i));
      state.teamIdx=Math.floor(Math.random()*state.teams.length);state.screen="roundIntro";render();break;
    case "newGame":resetGame();break;
  }
}

/* ---------- phone app (?p=CODE to pick words, ?c=CODE for the table chrono) ---------- */
const PKEY="tu-phone-"+ROOM;
let ph, pn={peer:null,conn:null,status:"connecting",config:null,tick:null,tickAt:0,wasRunning:false};
// Also kept under a code-independent key: if the tablet changes room code, the phone keeps its identity and its cards.
function psave(){store.set(PKEY,ph);if(ROLE==="player")store.set("tu-phone-last",ph)}
function ppool(){
  const cats=(pn.config&&Array.isArray(pn.config.cats)&&pn.config.cats.length)?pn.config.cats:["celeb","persos","trucs","lieux"];
  const taken=new Set(((pn.config&&pn.config.taken)||[]).concat(ph.picks).map(w=>String(w).toLowerCase()));
  const all=[];cats.forEach(c=>(WORDS[c]||[]).forEach(w=>all.push(w)));
  const free=all.filter(w=>!taken.has(w.toLowerCase()));
  return free.length>=2?free:all;
}
function newPair(){const p=shuffle(ppool());ph.pair=[p[0],p[1]];psave()}
function perPlayer(){return (pn.config&&+pn.config.per)||10}
function nCustoms(){const c=pn.config&&pn.config.customs;return c==null?2:Math.max(0,Math.min(3,+c||0))}
function psend(m){try{if(pn.conn&&pn.conn.open)pn.conn.send(Object.assign({pid:ph.pid,name:ph.name,gid:ph.gid||null},m))}catch(e){}}
function resetPhone(){ph.step="name";ph.picks=[];ph.custom=[];ph.pair=null;psave()}
function finishPicks(){
  ph.picks=ph.picks.slice(0,perPlayer());
  if(nCustoms()>0)ph.step="custom";
  else{ph.custom=[];ph.step="sent";sendWords()}
}
function sendWords(){psend({t:"words",picks:ph.picks,custom:ph.custom.filter(Boolean).slice(0,nCustoms())})}

/* Waiting screen: the player taps the team they want to join */
function teamPicker(){
  const teams=pn.config&&pn.config.teams,mine=pn.tick&&pn.tick.myTeam;
  if(!teams||!teams.length||pn.status!=="on")return "";
  const t=pn.tick||{},nameLine=t.myName?`<p class="lead">Tu joues sous le nom <b>${esc(t.myName)}</b></p>`:"";
  // Locked by the admin: show the team, no buttons.
  if(t.locked)return `${nameLine}<p class="lead">${ICON.lock.replace("<svg",'<svg style="width:16px;height:16px;vertical-align:-2px"')} L'admin a verrouillé ton nom et ton équipe</p>
    ${mine?`<div class="team-pick"><span class="tp on" style="--team:${esc(mine.color)};text-align:center;display:grid;place-items:center">${esc(mine.name)}</span></div>`:""}`;

function phoneView(){
  if(ROLE==="chrono")return "chrono";
  const t=pn.tick;
  if(t&&t.phase==="game"&&t.me){
    if(t.screen==="roundIntro"||t.screen==="ready")return "giver";
    if(t.screen==="turn"&&t.card)return "giver";
    if(t.screen==="turnEnd"&&t.rows)return "giver";
  }
  if(t&&t.phase!=="lobby")return "chrono";
  if(t&&t.screen==="setup")return "wait";
  if(!pn.config||!pn.config.gid)return pn.status==="on"?"wait":ph.step;
  return ph.step;
}
function pStatus(){
  const st=pn.status;
  if(st==="on")return `<span class="net on"><i></i>Connecté à la partie ${esc(ROOM)}</span>`;
  if(st==="nohost")return `<span class="net"><i></i>On cherche la tablette ${esc(ROOM)}…</span>${(pn.miss||0)>=4?`<p class="hint" style="margin-top:6px">La tablette ne répond pas. Vérifie qu'elle affiche bien le jeu. Si le code affiché sur la tablette n'est plus ${esc(ROOM)}, rescanne le QR code.</p>`:""}`;
  if(st==="error")return `<span class="net err"><i></i>Connexion perdue, nouvel essai…</span>`;
  return `<span class="net"><i></i>Connexion…</span>`;
}

/* Admin remote: a floating button on the admin's phone opens a panel that drives the tablet */
const pAdm={open:false,arm:null};
function renderAdmin(){

  const inp=document.getElementById("adm-name"),typed=inp?{v:inp.value,s:inp.selectionStart,f:document.activeElement===inp}:null;
  const sh=box.querySelector(".overlay"),scroll=sh?sh.scrollTop:0;
  box.innerHTML=(giving||pAdm.open?"":`<button class="adm-fab" data-act="admOpen">${ICON.crown}Admin</button>`)+(pAdm.open?vAdminPanel(a):"");
  const ov=box.querySelector(".overlay");if(ov)ov.scrollTop=scroll;
  const ni=document.getElementById("adm-name");
  if(ni&&typed){ni.value=typed.v;if(typed.f){ni.focus();try{ni.setSelectionRange(typed.s,typed.s)}catch(e){}}}
  else if(ni&&pAdm.focusEdit){pAdm.focusEdit=false;ni.focus();ni.select()}
}
function aBtn(a,label,cls){return `<button class="btn ${cls||"btn-ghost"} wide" data-act="adm" data-a="${a}">${label}</button>`}
function aConfirm(key,a,label,warn){
  if(pAdm.arm===key)return `<div class="confirm-box"><p><b>Sûr ?</b> ${warn}</p><div class="confirm-row"><button class="btn btn-tomato small" data-act="adm" data-a="${a}">Oui</button><button class="btn btn-ghost small" data-act="admDisarm">Annuler</button></div></div>`;
  return `<button class="btn btn-ghost wide" data-act="admArm" data-k="${key}">${label}</button>`;
}
function vAdminPanel(a){
  const s=a.screen;let body="";
  if(s==="setup"){
    body=`<p class="lead">La tablette est sur l'accueil. Lance une nouvelle partie depuis la tablette.</p>`;
  }else if(s==="lobby"&&a.lobby){
    const L=a.lobby;
    const segs=(key,opts,cur)=>`<div class="seg">${opts.map(([v,l])=>`<button data-act="adm" data-a="${key}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join("")}</div>`;
    body=`<div class="adm-sec">
      <div class="opt"><span>Cartes à choisir</span>${segs("per",[[5,5],[8,8],[10,10]],L.per)}</div>
      <div class="opt"><span>Cartes perso à écrire</span>${segs("customs",[[0,"Aucune"],[1,1],[2,2],[3,3]],L.customs)}</div>
      <div class="opt"><span>Cartes affichées sur</span>${segs("giverMode",[[0,"La tablette"],[1,"Les téléphones"]],L.giverPhones?1:0)}</div>
      <h3>Joueurs</h3>
      <ul class="adm-players">${L.players.map(p=>{
        const tm=L.teams[p.team]||L.teams[0],armed=pAdm.arm==="k"+p.pid;
        if(pAdm.edit===p.pid)return `<li class="editing"><input id="adm-name" class="field" maxlength="24" value="${esc(p.name)}" autocomplete="off" aria-label="Nouveau nom">
          <button class="btn btn-sun small" data-act="admRenameOk" data-pid="${esc(p.pid)}">OK</button><button class="adm-kick" data-act="admRenameCancel">Annuler</button></li>`;
        return `<li class="${p.ready?"ready":""}">
          <div class="adm-row"><span class="pdot ${p.online?"on":""}"></span><b>${esc(p.name)}</b><span class="st">${p.ready?"✓":p.n+"/"+L.per}</span>
            <button class="adm-ico" data-act="admRename" data-pid="${esc(p.pid)}" aria-label="Renommer ${esc(p.name)}">${ICON.pen}</button>
            <button class="adm-ico ${p.locked?"on":""}" data-act="adm" data-a="lock" data-pid="${esc(p.pid)}" aria-label="${p.locked?"Déverrouiller":"Verrouiller"} ${esc(p.name)}">${p.locked?ICON.lock:ICON.unlock}</button></div>
          <div class="adm-row"><button class="adm-team" style="--team:${esc(tm.color)}" data-act="adm" data-a="pteam" data-pid="${esc(p.pid)}">${esc(tm.name)}</button>
            <button class="adm-kick ${armed?"arm":""}" data-act="${armed?"adm":"admArm"}" data-a="kick" data-pid="${esc(p.pid)}" data-k="k${esc(p.pid)}">${armed?"Retirer ?":"Retirer"}</button></div></li>`;
      }).join("")||`<li>Personne pour l'instant</li>`}</ul>
      <p class="hint">Touche l'équipe d'un joueur pour le changer d'équipe. Le crayon renomme, le cadenas bloque son nom et son équipe sur son téléphone.</p>
      ${L.emptyTeams&&L.emptyTeams.length?`<p class="who warn">${L.emptyTeams.map(esc).join(", ")} : aucun joueur, ses tours se joueront sur la tablette.</p>`:""}
      <button class="btn btn-sun wide" data-act="adm" data-a="lobbyStart" ${L.n<5?"disabled":""}>Lancer la partie · ${plural(L.n,"carte")}</button>
    </div>`;
  }else{
    if(s==="roundIntro"||s==="ready")body+=`<p class="lead">Manche ${a.round} · au tour de <b>${esc(a.team||"")}</b></p>`
      +(a.canTablet?aConfirm("tab","goTablet","Jouer ce tour sur la tablette","Les cartes vont s'afficher sur la tablette, tout le monde pourra les voir."):"")
      +(a.tabletGo?aBtn("go","Lancer le chrono (cartes sur la tablette)","btn-sun"):"");
    if(s==="turn")body+=a.paused
      ?aBtn("resume","Reprendre","btn-sun")+(a.onPhone&&!a.giverOnline?aConfirm("take","takeoverTablet","Jouer ce tour sur la tablette","Les cartes vont s'afficher sur la tablette, tout le monde pourra les voir."):"")
      :aBtn("pause","Pause","btn-sun");
    if(s==="turnEnd"&&a.recapBy!=null)body+=`<p class="lead"><b>+${plural(a.pts||0,"point")}</b> · ${esc(a.recapBy)} vérifie les cartes sur son téléphone.</p>`
      +(a.giverOnline?"":aConfirm("recap","recapTablet","Vérifier les cartes sur la tablette","Les cartes vont s'afficher sur la tablette, tout le monde pourra les voir."));
    if(s==="turnEnd"&&a.rows)body+=`<div class="recap">${a.rows.map((r,i)=>`<button class="tr ${r.ok?"is-ok":(r.last?"is-last":"is-no")}" data-act="adm" data-a="toggleRow" data-i="${i}"><span>${esc(r.w)}</span><i>${r.ok||r.last?ICON.ok:ICON.no}</i></button>`).join("")||`<p class="lead">Aucune carte ce tour-ci.</p>`}</div>
      <p class="hint">Touche une carte pour corriger.</p>`+aBtn("confirmTurn",`Valider · +${plural(a.rows.filter(r=>r.ok).length,"point")}`,"btn-sun");
    if(s==="roundEnd")body+=aBtn("nextRound",a.round<3?"Manche suivante":"Résultat final","btn-sun");
    if((s==="ready"||s==="roundEnd")&&a.undo)body+=`<button class="undo-btn" data-act="adm" data-a="undoTurn">${ICON.undo}<span>Corriger le tour précédent <small>${esc(a.undo.team)} · +${a.undo.pts}</small></span></button>`;
    if(s==="gameEnd")body+=aBtn("rematch","Revanche, mêmes cartes","btn-sun")+aBtn("newGame","Nouvelle partie");
    if(a.scores)body+=`<div class="adm-scores">${a.scores.map(x=>`<span>${esc(x.name)} · ${x.total}</span>`).join("")}</div>`;
    if(s!=="gameEnd")body+=aConfirm("quit","quit","Abandonner la partie","La partie en cours sera perdue et la tablette revient à l'accueil.");
  }
  return `<div class="overlay" data-act="admClose"><div class="sheet" data-stop>
    <h2>Admin</h2><p class="hint">Tu pilotes la tablette depuis ton téléphone.</p>
    ${body}
    <button class="btn btn-ghost" data-act="admClose">Fermer</button>
  </div></div>`;
}
let phoneAudio=false;
function prender(){
  const v=phoneView();
  app.className=(v==="giver"&&pn.tick&&pn.tick.screen==="turn")?"fill gmode":"scroll";
  pn.lock=false;
  app.innerHTML=vPhone();pUpdateTimer();renderAdmin();
}
function pLeft(){const t=pn.tick;if(!t||t.left==null)return 0;return Math.max(0,t.running?t.left-(Date.now()-pn.tickAt):t.left)}
function pUpdateTimer(){
  const num=document.getElementById("c-num");if(!num)return;
  const t=pn.tick,left=pLeft(),sec=Math.ceil(left/1000);
  num.innerHTML=sec+"<small>″</small>";
  const bar=document.getElementById("c-bar");if(bar)bar.style.width=Math.max(0,left/(t.dur||30000)*100)+"%";
  const box=document.getElementById("chrono");if(box)box.classList.toggle("danger",sec<=5);
}
function onPhoneData(d){
  if(!d||typeof d!=="object")return;
  if(d.t==="config"){
    const before=phoneView();
    pn.config=d;
    // A new game on the tablet: everything chosen for the previous one is wiped.
    if(d.gid&&ph.gid!==d.gid){
      const had=!!ph.gid;ph.gid=d.gid;
      if(had||ph.step!=="name")resetPhone();
      psave();prender();
      if(ph.name)psend({t:"progress",n:0});
      return;
    }
    if(ph.step==="pick"&&ph.picks.length>=perPlayer()){finishPicks();psave();prender();return}
    if(before!==phoneView()||phoneView()==="sent"){prender();return}
    if(ph.pair&&((d.taken||[]).map(w=>String(w).toLowerCase()).some(w=>w===String(ph.pair[0]).toLowerCase()||w===String(ph.pair[1]).toLowerCase()))){newPair();if(phoneView()==="pick")prender()}
    if(phoneView()==="pick")prender();
    return;
  }
  if(d.t==="tick"){
    const before=phoneView();
    if(pn.wasRunning&&d.screen==="turnEnd"&&d.reason==="time")sfx.buzz();
    pn.wasRunning=d.screen==="turn"&&d.running;
    // "+1" each time the playing team gets a card (not on the phone that holds the cards, it already knows).
    if(d.screen==="turn"&&d.found!=null){
      if(pn.plusTurn===d.turnNo&&d.found>(pn.plusFound||0)&&!d.card){popPlus(d.found-(pn.plusFound||0),d.color);if(phoneAudio)sfx.found()}
      pn.plusTurn=d.turnNo;pn.plusFound=d.found;
    }
    // The admin renamed this player: the phone takes that name so it never sends the old one back.
    if(d.myName&&d.renamed&&ph.name!==d.myName){ph.name=d.myName;psave()}
    pn.tick=d;pn.tickAt=Date.now();
    const admSig=JSON.stringify(d.adm||null);
    if(admSig!==pn.admSig){pn.admSig=admSig;renderAdmin()}
    const after=phoneView();
    // Re-render only when something visible changed (never on the name / pick / custom screens, which hold inputs).
    const live=["chrono","giver","sent","wait"].includes(after);
    const sig=after+"|"+(live?JSON.stringify([d.screen,d.card,d.seq,d.rows,d.paused,d.cardsLeft,d.running,d.team,d.giverName,d.myTeam&&d.myTeam.name,d.reason,d.phase,d.scores,d.last,d.myName,d.locked]):"");
    if(sig!==pn.sig||before!==after){pn.sig=sig;prender()}
    else pUpdateTimer();
  }
}
async function phoneConnect(){
  try{await loadScript(LIBS.peer)}catch(e){pn.status="error";prender();setTimeout(phoneConnect,4000);return}
  openPhonePeer();
}
function openPhonePeer(){
  const peer=new Peer({debug:0});pn.peer=peer;
  peer.on("open",connectHost);
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(e){}});
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){pn.status="nohost";pn.miss=(pn.miss||0)+1;prender();setTimeout(connectHost,3000);return}
    if(["network","server-error","socket-error","socket-closed"].includes(e.type)){
      pn.status="error";prender();try{peer.destroy()}catch(_){}
      pn.peer=null;setTimeout(openPhonePeer,4000);
    }
  });
}
function connectHost(){
  if(!pn.peer||pn.peer.destroyed||!pn.peer.open)return;
  if(pn.conn&&pn.conn.open)return;
  const conn=pn.peer.connect(PEER_PREFIX+ROOM,{reliable:true});pn.conn=conn;
  conn.on("open",()=>{
    pn.status="on";pn.miss=0;
    // Always say hello first so the tablet knows which player this phone is (needed for phone turns).
    if(ROLE!=="chrono")psend({t:"hello"});
    if(ROLE==="chrono")psend({t:"chrono"});
    else if(ph.step==="sent")sendWords();
    else if(ph.step!=="name")psend({t:"progress",n:ph.picks.length});
    prender();
  });
  conn.on("data",onPhoneData);
  conn.on("close",()=>{if(pn.conn===conn){pn.conn=null;pn.status="connecting";prender();setTimeout(connectHost,2000)}});
  conn.on("error",()=>{});
}
function phoneBoot(){
  state={settings:{sound:true}};
  ph=store.get(PKEY)||(ROLE==="player"?store.get("tu-phone-last"):null)||{};
  ph=Object.assign({pid:"p"+Math.random().toString(36).slice(2,10),name:"",step:"name",picks:[],custom:["",""],pair:null},ph);
  if(!Array.isArray(ph.custom))ph.custom=["",""];
  psave();
  document.addEventListener("click",e=>{
    const el=e.target.closest("[data-act]");if(!el)return;
    if(e.target.closest("[data-stop]")&&el.matches(".overlay"))return;
    phoneAudio=true;audio();
    switch(el.dataset.act){
      case "pName":{const v=cleanStr((document.getElementById("p-name")||{}).value||"",24);if(!v){document.getElementById("p-name").focus();return}
        ph.name=v;ph.step="pick";newPair();psave();psend({t:"progress",n:ph.picks.length});prender();break}
      case "pick":{const w=ph.pair[+el.dataset.i];if(w&&!ph.picks.includes(w))ph.picks.push(w);
        if(ph.picks.length>=perPlayer())finishPicks();else newPair();
        psave();if(ph.step!=="sent")psend({t:"progress",n:ph.picks.length});sfx.found();prender();break}
      case "reroll":newPair();prender();break;
      case "pSend":ph.custom=Array.from({length:nCustoms()},(_,i)=>{const f=document.getElementById("p-c"+i);return f?cleanStr(f.value,60):""});
        ph.step="sent";psave();sendWords();prender();break;
      case "pUndo":ph.step="pick";ph.picks.pop();newPair();psave();psend({t:"progress",n:ph.picks.length});prender();break;
      case "pRestart":ph.step="pick";ph.picks=[];newPair();psave();psend({t:"progress",n:0});prender();break;
      case "pSound":sfx.found();prender();break;
      case "pTeam":psend({t:"team",team:+el.dataset.i});break;
      case "gToggle":psend({t:"act",a:"toggle",i:+el.dataset.i});break;
      case "gConfirm":psend({t:"act",a:"confirm"});break;
      case "admOpen":pAdm.open=true;pAdm.arm=null;renderAdmin();break;
      case "admRename":pAdm.edit=el.dataset.pid;pAdm.focusEdit=true;renderAdmin();break;
      case "admRenameCancel":pAdm.edit=null;renderAdmin();break;
      case "admRenameOk":{
        const v=cleanStr((document.getElementById("adm-name")||{}).value||"",24);
        if(v)psend({t:"admin",a:"rename",target:el.dataset.pid,name:v});
        pAdm.edit=null;renderAdmin();break;
      }
      case "admClose":pAdm.open=false;pAdm.arm=null;renderAdmin();break;
      case "admArm":pAdm.arm=el.dataset.k;renderAdmin();break;
      case "admDisarm":pAdm.arm=null;renderAdmin();break;
      case "adm":{
        const d=el.dataset;
        // "target" is the player the admin acts on; "pid" stays this phone's own id.
        psend({t:"admin",a:d.a,v:d.v==null?null:d.v,target:d.pid||"",i:d.i==null?null:d.i});
        pAdm.arm=null;renderAdmin();break;
      }
      case "gGo":psend({t:"act",a:"go"});break;
      case "gFound":case "gPass":{
        if(pn.lock||!pn.tick||pn.tick.paused)return;
        pn.lock=true;setTimeout(()=>{pn.lock=false},1500);
        const a=el.dataset.act==="gFound"?"found":"pass";
        psend({t:"act",a,seq:pn.tick.seq});
        if(a==="found")sfx.found();else sfx.pass();
        break;
      }
    }
  });
  document.addEventListener("input",e=>{const m=/^p-c(\d)$/.exec(e.target.id);if(m){ph.custom[+m[1]]=e.target.value;psave()}else if(e.target.id==="p-name"){ph.name=e.target.value;psave()}});
  document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="adm-name"){e.preventDefault();const ok=document.querySelector("[data-act=admRenameOk]");if(ok)ok.click()}});
  setInterval(()=>{if(phoneView()==="chrono")pUpdateTimer()},100);
  async function lock(){try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}}
  lock();document.addEventListener("visibilitychange",()=>{if(!document.hidden)lock()});
  prender();
  if(!ROOM){app.innerHTML=`<div class="phone"><div class="phone-main"><h1>Code de partie manquant</h1><p class="lead">Scanne à nouveau le QR code de la tablette.</p></div></div>`;return}
  phoneConnect();
}

/* ---------- boot ---------- */
function start(data){
  let st=(data&&data.state)||store.get(KEY);
  if(!st||!st.settings||!st.screen)st=initial();
  st.settings=Object.assign(defaults(),st.settings);
  // Back another day (or first time): team names reset to the defaults and the app opens on the welcome screen.
  const stale=!st.settings.seenAt||Date.now()-st.settings.seenAt>STALE_MS;
  if(stale&&(st.screen==="setup"||st.screen==="home")){st.settings.teams=defaultTeams();st.screen="home"}
  st.settings.teams.forEach(t=>{if(OLD_NAMES.includes(t.name))t.name=colorName(t.color)});
  if(st.teams)st.teams.forEach(t=>{if(OLD_NAMES.includes(t.name))t.name=colorName(t.color)});
  if(st.turn&&!st.turn.rows){st.turn=null;if(st.screen==="turn"||st.screen==="turnEnd")st.screen="ready"}
  if(st.screen==="ready"&&st.round===undefined)st.screen="setup";
  if(st.screen==="turn"&&st.turn)st.turn.paused=true;
  // Duo: a reload pauses the chrono; without a duo in memory, back to the duo screen.
  if(/^duo/.test(st.screen)){
    if(st.screen!=="duoSetup"&&!(st.duo&&st.duo.plays&&st.duo.parts&&st.duo.parts.length===4&&st.duo.deck&&st.duo.deck.length))st.screen="duoSetup";
    if(st.screen==="duoTurn"&&!st.duo.paused){st.duo.left=Math.max(0,st.duo.endsAt-Date.now());st.duo.paused=true}
  }
  if(st.screen==="lobby"){if(!st.lobby||!st.code)st={screen:"setup",settings:st.settings}}
  else if(st.screen!=="setup"&&st.screen!=="home"&&!/^duo/.test(st.screen)&&(!st.deck||!st.teams))st={screen:"setup",settings:st.settings,code:st.code,online:st.online,admin:st.admin};
  state=st;
  if(ONLINE)claimHost();
  render();
  if(ONLINE&&(state.screen==="lobby"||state.online))hostStart();
}
/* ---------- auto update ----------
   On launch and each time the app comes back to the screen, it checks GitHub for a newer
   index.html and reloads itself (never in the middle of a turn). No need to redo the bookmark. */
const VERSION="v1.26";
let newVer=null;
function calmToReload(){
  if(ROLE!=="host")return !(pn.tick&&pn.tick.me&&pn.tick.screen==="turn");
  return !state||["home","setup","lobby","duoSetup","duoRecap","duoEnd","gameEnd"].includes(state.screen);
}
function applyUpdate(){
  if(!newVer||!calmToReload())return;
  let tried=null;try{tried=sessionStorage.getItem("tu-upd")}catch(e){}
  if(tried===newVer)return; // already tried once for this version: avoid a reload loop
  try{sessionStorage.setItem("tu-upd",newVer)}catch(e){}
  const el=document.getElementById("upd");if(el)el.hidden=false;
  const q=new URLSearchParams(location.search);q.set("v",newVer.replace(/\D/g,""));
  setTimeout(()=>location.replace(location.pathname+"?"+q.toString()+location.hash),400);
}
async function checkUpdate(){
  if(!ONLINE)return;
  try{
    const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});
    if(!r.ok)return;
    const m=/const VERSION="(v[\d.]+)"/.exec(await r.text());
    if(m&&m[1]!==VERSION){newVer=m[1];applyUpdate()}
  }catch(e){}
}
if(ONLINE){
  setTimeout(checkUpdate,1500);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
  setInterval(()=>{if(newVer)applyUpdate()},5000);
}
if(ROLE!=="host"&&ONLINE){phoneBoot()}
else{
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({state}))}catch(e){}
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
}
})();
